<!doctype html><html><head><meta charset="utf-8"><title>Taympers title picture renderer</title><style>html,body{margin:0;background:#000}canvas{display:block}</style></head><body>
<script type="module">
// Offline renderer for the main menu's still pictures in maps/world/ (not part of the game). Run: node tools/title-render.mjs
// ?w=&h= picture size; &fx=&fy= where the kids stand and &fw= the width left free for them (see layout() in maps/title.js)
import { create, LAYOUT } from '../maps/title.js';
const P = new URLSearchParams(location.search), W = +(P.get('w') || 1920), H = +(P.get('h') || 1080), num = k => P.get(k) == null ? null : +P.get(k);
for (const k of ['y', 'z']) if (P.get('c' + k)) LAYOUT.tall[k] = +P.get('c' + k); // try other portrait cameras: &cy=&cz=
const cv = document.createElement('canvas'); cv.style.width = W + 'px'; cv.style.height = H + 'px'; document.body.appendChild(cv);
try {
  const t = create(cv, { maxDpr: 1 }); await t.ready;
  t.layout(W, H, { x: num('fx'), y: num('fy'), fw: num('fw') }); t.still(+(P.get('t') || 0));
  window.__out = cv.toDataURL('image/jpeg', +(P.get('q') || .82));
} catch (e) { window.__err = String(e && e.stack || e); }
window.__done = true;
</script>
</body></html>
