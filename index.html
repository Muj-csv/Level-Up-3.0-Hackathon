/* Layout: one full-bleed canvas world (sky, floating islands, minigame arenas); DOM "stickers" float on top: title menu, players across the top, actions along the bottom, cards in the middle. Deliberately one daytime look. */
:root{

}

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px}
.top{display:flex;flex-direction:column;align-items:center;gap:7px}
.players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:100%;max-width:620px}

.pcard .st{grid-column:1 / -1;display:flex;gap:9px;margin-top:4px;font-family:var(--display);font-size:15px;line-height:1;font-variant-numeric:tabular-nums}

(function(){

  coin(){this.tone(988,.07,'square',.03);this.tone(1319,.15,'square',.03,null,.07);},

const Music={cur:null,step:0,next:0,timer:0,bus:null,noise:null,

    game:{bpm:138,vol:.42,bars:[[0,'Am'],[0,'F'],[0,'C'],[0,'G']],

  },

function shapeR(isl,th){const s=isl.seed;return 1+.05*Math.sin(3*th+s)+.035*Math.sin(5*th+2*s)+.02*Math.sin(9*th+3*s);}

function buildPath(){
  ISL.forEach((isl,i)=>{const prev=ISL[(i+3)%4],next=ISL[(i+1)%4];let a0=paramToward(isl,prev),a1=paramToward(isl,next);while(a1<=a0)a1+=TAU;isl.a0=a0;isl.a1=a1;});
  const pts=[];
  ISL.forEach((isl,i)=>{
    const next=ISL[(i+1)%4];const steps=Math.ceil((isl.a1-isl.a0)/.01);
    for(let k=0;k<=steps;k++){const th=isl.a0+(isl.a1-isl.a0)*k/steps;pts.push({x:isl.x+Math.cos(th)*isl.rx*PK,y:isl.y+Math.sin(th)*isl.ry*PK,isl:i});}
    const p0={x:isl.x+Math.cos(isl.a1)*isl.rx*PK,y:isl.y+Math.sin(isl.a1)*isl.ry*PK};
    const q={x:next.x+Math.cos(next.a0)*next.rx*PK,y:next.y+Math.sin(next.a0)*next.ry*PK};
    isl.out=p0;next.inn=q;
    const L=Math.hypot(q.x-p0.x,q.y-p0.y),n=Math.ceil(L/4);
    for(let k=1;k<n;k++){const t=k/n;pts.push({x:lerp(p0.x,q.x,t),y:lerp(p0.y,q.y,t),br:i,t});}
  });
  const cum=[0];for(let k=1;k<=pts.length;k++){const a=pts[k-1],b=pts[k%pts.length];cum.push(cum[k-1]+Math.hypot(b.x-a.x,b.y-a.y));}
  const total=cum[pts.length],N=Math.round(total/108),step=total/N,out=[];let j=0;

    out.push({x:lerp(a.x,b.x,u),y:lerp(a.y,b.y,u),isl:a.isl,br:a.br,t:a.t,pulse:0});}
  return out;
}

/* coins that fly from the board into the HUD */
const flyers=[];
function worldToScreen(x,y){if(B3.on){const s=B3.proj(x,0,y);return{x:s.x,y:s.y};}return{x:(x-cam.x)*cam.z+W/2,y:(y-cam.y)*cam.z+H/2+camOffY()};}
function coinFly(p,n){
  if(n<=0)return;const c=cards[p.id];if(!c){return;}
  const cr=cv.getBoundingClientRect(),tr=c.cs.getBoundingClientRect();const tx=tr.left-cr.left+8,ty=tr.top-cr.top+tr.height/2;
  const s=worldToScreen(p.x,p.y-40);const cnt=Math.min(10,n),base=Math.floor(n/cnt),extra=n%cnt;p.pend=(p.pend||0)+cnt;
  for(let i=0;i<cnt;i++)flyers.push({p,x0:s.x+(R()-.5)*34,y0:s.y+(R()-.5)*20,tx,ty,t:-i*.06,dur:.55+R()*.15,amt:base+(i<extra?1:0),spin:R()*TAU});
}
function updFlyers(dt){for(let i=flyers.length-1;i>=0;i--){const f=flyers[i];f.t+=dt;f.spin+=dt*14;if(f.t>=f.dur){flyers.splice(i,1);const p=f.p;p.pend=Math.max(0,p.pend-1);p.shown=Math.min(p.piso,p.shown+f.amt);if(p.pend===0)p.shown=p.piso;const c=cards[p.id];if(c){c.c.textContent=p.shown;bumpEl(c.cs);}Sfx.tick(8);}}}
function drawFlyers(g){for(const f of flyers){if(f.t<0)continue;const u=Ez.inOut(clamp(f.t/f.dur,0,1)),cx=(f.x0+f.tx)/2,cy=Math.min(f.y0,f.ty)-90;
  const x=(1-u)*(1-u)*f.x0+2*(1-u)*u*cx+u*u*f.tx,y=(1-u)*(1-u)*f.y0+2*(1-u)*u*cy+u*u*f.ty;const k=1-u*.35;
  ell(g,x,y,8*k,8*k*Math.max(.2,Math.abs(Math.cos(f.spin))));fs(g,'#FFD34D',INK,1.8);}}

const NET={cfg:null,on:false,host:false,rm:null,code:'',my:null,hostPeer:null,hostSeenAt:0,gid:'',log:{},logMax:0,inp:{},peers:[],seen:new Map(),roster:[],rosterKey:'',name:'',started:'',onUpdate:null,unsub:null,gone:false,mgAt:0};

/* Supabase room: the same join(name) -> {peers, onPeers, presence, leave} shape as the Claude room (see tests/mock-room.js).
   Free plan (Oct 2026): 100 messages/s and 20 presence messages/s per project; a broadcast counts once sent plus once per listener.
   So each device broadcasts its whole presence object, at most every SUPA_GAP ms (the latest state wins), plus a heartbeat;
   Supabase presence is only tracked once, to hear when a device's connection closes.
   ponytail: one busy 4-phone room uses about 64 messages/s in minigames; raise SUPA_GAP or move to a paid plan for more rooms */
const SUPA_GAP=250,SUPA_BEAT=2000,SUPA_DROP=6000,SUPA_LOST=90000;
let supaLib=null;
function supaLoad(){return supaLib||(supaLib=new Promise((res,rej)=>{const s=document.createElement('script');s.src='vendor/supabase-2.118.0.js';
  s.onload=()=>window.supabase?res(window.supabase.createClient(SUPA.url,SUPA.key)):rej(new Error('nolib'));s.onerror=()=>{supaLib=null;rej(new Error('nolib'));};document.head.appendChild(s);}));}
function supaRoom(client){return{join(name){return new Promise((resolve,reject)=>{
  const me=netPid(),peers=new Map(),ch=client.channel(name,{config:{broadcast:{self:false},presence:{key:me}}});
  let mine={},subs=[],left=false,joined=false,lastSend=0,timer=0,beat=0,lostT=0;
  const list=()=>[{peer:me,sameTab:true,presence:mine}].concat([...peers].map(([peer,v])=>({peer,sameTab:false,presence:v.presence})));
  const emit=()=>{const ps=list();subs.forEach(s=>{try{s.cb({peers:ps});}catch(e){console.error(e);}});};
  const sendNow=()=>{clearTimeout(timer);timer=0;if(left||!joined)return;lastSend=Date.now();ch.send({type:'broadcast',event:'p',payload:{id:me,presence:mine}});};
  const send=()=>{if(timer)return;const w=lastSend+SUPA_GAP-Date.now();if(w<=0)sendNow();else timer=setTimeout(sendNow,w);};
  ch.on('broadcast',{event:'p'},({payload:m})=>{if(!m||m.id===me)return;const had=peers.has(m.id);peers.set(m.id,{presence:m.presence||{},seen:Date.now()});if(!had)send();emit();});
  ch.on('broadcast',{event:'bye'},({payload:m})=>{if(m&&peers.delete(m.id))emit();});
  ch.on('presence',{event:'join'},({key})=>{if(key!==me)send();});
  ch.on('presence',{event:'leave'},({key})=>{if(peers.delete(key))emit();});
  /* supabase-js rejoins by itself after a network blip; the game is only told the room is gone if that takes longer than SUPA_LOST (past the game's 60 s grace) */
  ch.subscribe((st,err)=>{
    if(st==='SUBSCRIBED'){clearTimeout(lostT);lostT=0;ch.track({at:Date.now()});
      if(!joined){joined=true;sendNow();beat=setInterval(()=>{if(Date.now()-lastSend>=SUPA_BEAT)sendNow();const t=Date.now();let gone=false;for(const [id,v] of peers)if(t-v.seen>SUPA_DROP){peers.delete(id);gone=true;}if(gone)emit();},500);resolve(api);}
      else sendNow();}
    else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){if(left)return;if(!joined){reject(err||new Error(st));return;}
      if(!lostT)lostT=setTimeout(()=>{subs.forEach(s=>{try{s.err&&s.err(err||new Error(st));}catch(e){}});},SUPA_LOST);}});
  const api={peers:list,
    onPeers(cb,err){const s={cb,err};subs.push(s);setTimeout(emit,0);return()=>{subs=subs.filter(x=>x!==s);};},
    presence(patch){mine=Object.assign({},mine,patch);send();setTimeout(emit,0);return Promise.resolve();},
    leave(){if(left)return Promise.resolve();left=true;clearInterval(beat);clearTimeout(timer);clearTimeout(lostT);
      try{ch.send({type:'broadcast',event:'bye',payload:{id:me}});}catch(e){}return client.removeChannel(ch).then(()=>{},()=>{});}};
});}};}
async function netJoin(code){
  const room=await netRoom();if(!room)throw new Error('noroom');
  const rm=await room.join('lsu-'+code.toLowerCase());NET.rm=rm;NET.code=code;NET.seen=new Map();NET.peers=rm.peers()||[];
  NET.unsub=rm.onPeers(ch=>onNetPeers(ch),e=>netTerminal(e));return rm;
}
function netPres(patch){if(NET.rm)NET.rm.presence(patch).catch(()=>{});}
function netLeave(){try{NET.unsub&&NET.unsub();}catch(e){}const rm=NET.rm;Object.assign(NET,{on:false,host:false,rm:null,code:'',hostPeer:null,gid:'',log:{},logMax:0,inp:{},roster:[],rosterKey:'',started:'',onUpdate:null,unsub:null,gone:false,game:null,cp:null,rejoin:'',hostGone:false});try{rm&&rm.leave().catch(()=>{});}catch(e){}}
function netPeer(peer){return NET.peers.find(q=>q.peer===peer);}
function myPeer(){if(!NET.my&&NET.rm){try{const me=(NET.rm.peers()||[]).find(q=>q.sameTab);if(me)NET.my=me.peer;}catch(e){}}return NET.my;}
function netHost(){return NET.peers.find(q=>!q.sameTab&&q.presence&&q.presence.app===APPID&&q.presence.role==='host');}
function netTerminal(){if(APP.screen==='game'&&NET.on&&!NET.gone){NET.gone=true;lostConnection('Naputol ang koneksyon sa online room.');}}
function onNetPeers(ch){
  NET.peers=ch.peers;const me=ch.peers.find(q=>q.sameTab);if(me)NET.my=me.peer;const t=Date.now();for(const q of ch.peers)if(!NET.seen.has(q.peer))NET.seen.set(q.peer,t);
  if(NET.host){if(!NET.on)hostRoster();}
  else{const h=netHost();if(h&&h.presence.build!==BUILD){netWrongBuild();return;}if(h){NET.hostPeer=h.peer;NET.hostSeenAt=t;const pr=h.presence;
      if(pr.log&&NET.gid&&pr.gid===NET.gid)mergeLog(pr.log);
      if(pr.st==='play'&&pr.gid&&pr.gid!==NET.started&&(APP.screen!=='game'||state.ended)){NET.started=pr.gid;const mine=(pr.roster||[]).some(e=>e.p===NET.my);if(mine)startOnline(pr);else joinFull();}}}
  if(NET.onUpdate)NET.onUpdate();

/* a guest on another build can't join: the host never seats it, and the guest is told to reload and leaves the room */
function netWrongBuild(){if(NET.badBuild)return;NET.badBuild=true;NET.onUpdate=null;NET.rejoin='';netLeave();netUnsave();dbg('build',{mine:BUILD});
  const c=openCard('<h2>Ibang bersiyon</h2><p>Iba ang bersiyon ng laro mo. I-refresh para makasali.</p><div class="row"><button type="button" class="btn" data-v="back">Balik</button><button type="button" class="btn primary" data-v="reload" data-primary>I-refresh</button></div>');
  cardChoice(c).then(v=>{NET.badBuild=false;if(v==='reload')location.reload();else toTitle();});}
function mergeLog(lg){for(const key in lg){const k=+key.slice(1);if(k&&NET.log[k]===undefined){NET.log[k]=lg[key];if(k>NET.logMax)NET.logMax=k;}}}
function hostRoster(){
  const guests=NET.peers.filter(q=>!q.sameTab&&q.presence&&q.presence.app===APPID&&q.presence.role==='guest'&&q.presence.build===BUILD&&!q.presence.gid).sort((a,b)=>(NET.seen.get(a.peer)||0)-(NET.seen.get(b.peer)||0)).slice(0,3);
  const roster=[{n:NET.name,p:myPeer()}].concat(guests.map(q=>({n:cleanName(q.presence.name)||'Kalaro',p:q.peer})));

/* the host keeps the whole game's log in its presence (a 5-round game logs about 60–120 small entries), so a device that drops out can always catch up */
function netPubLog(){const ks=Object.keys(NET.log).map(Number).sort((a,b)=>b-a).slice(0,200);const out={};for(const x of ks)out['k'+x]=NET.log[x];netPres({log:out});}

/* F7.3 rejoin after a reload: each tab keeps its player id and online session in sessionStorage (it survives a reload, or the
   browser putting the tab back after closing it in the background). A guest comes back from the host's latest turn checkpoint;
   the host comes back from its own checkpoint and log, which only it has. Not inside Claude, whose room service picks the ids */
const OL_KEY='lsu-online';
function netPid(){let id='';try{id=sessionStorage.getItem('lsu-pid')||'';if(!id){id='p'+Math.random().toString(36).slice(2,10);sessionStorage.setItem('lsu-pid',id);}}catch(e){}return id||'p'+Math.random().toString(36).slice(2,10);}
function netSave(){if(!NET.on||!NET.game||state.ended||inClaude())return;const o=Object.assign({code:NET.code,host:NET.host,name:NET.name,at:Date.now()},NET.game);
  if(NET.host)Object.assign(o,{cp:NET.cp,log:NET.log});try{sessionStorage.setItem(OL_KEY,JSON.stringify(o));}catch(e){}}
function netSaved(){try{const o=JSON.parse(sessionStorage.getItem(OL_KEY)||'null');return o&&o.gid&&o.code&&Date.now()-o.at<30*60000?o:null;}catch(e){return null;}}
function netUnsave(){try{sessionStorage.removeItem(OL_KEY);}catch(e){}}
function netCheckpoint(cp){if(NET.host){NET.cp=cp;netPres({cp});}netSave();}
async function netResume(o){
  showMsg('Bumabalik sa online na laro…','Room '+o.code+'.');
  try{NET.host=!!o.host;NET.name=o.name;await netJoin(o.code);NET.host=!!o.host;NET.name=o.name;}catch(e){netLeave();return netFail();}
  if(o.host){NET.roster=o.roster;NET.cfg=o.cfg;netPres({app:APPID,role:'host',build:BUILD,name:o.name,st:'play',gid:o.gid,seed:o.seed,roster:o.roster,cfg:o.cfg,cp:o.cp||null,inp:null,mg:null});
    startOnline(o,o.cp,o.log);netPubLog();return;}
  /* a guest waits for the host's presence: onNetPeers then starts the game from the host's checkpoint (see startOnline) */
  NET.rejoin=o.gid;netPres({app:APPID,role:'guest',build:BUILD,name:o.name,gid:''});NET.hostSeenAt=Date.now();
  setTimeout(()=>{if(NET.rejoin!==o.gid||APP.screen==='game')return;NET.rejoin='';netLeave();
    const c=openCard('<h2>Hindi na makabalik</h2><p>Wala na ang larong ito sa room '+esc(o.code)+'.</p><div class="row"><button type="button" class="btn primary" data-v="ok" data-primary>Sige</button></div>');cardChoice(c).then(()=>toTitle());},20000);
}
function netInput(k,v){if(NET.host){netRecord(k,{v});return;}NET.inp['k'+k]=v;const ks=Object.keys(NET.inp).sort((a,b)=>+a.slice(1)-+b.slice(1));while(ks.length>12)delete NET.inp[ks.shift()];netPres({inp:Object.assign({},NET.inp)});}
function netMg(obj,throttle){const t=Date.now();if(throttle&&t-NET.mgAt<110)return;NET.mgAt=t;netPres({mg:obj});}
function netPeerMg(peer,mgi){const q=netPeer(peer);const pr=q&&q.presence;return pr&&pr.gid===NET.gid&&pr.mg&&pr.mg.i===mgi?pr.mg:null;}
/* F7.3: a player who drops out gets NET_GRACE to come back before a bot plays for them (the seat is handed back by seatSync);
   a player who is there but slow gets the decision's own timeout. Guests keep waiting for a host who drops out
   (it may be their own connection that is down) and can leave from the menu. window.LSU_NET.grace shortens it for tests */
const NET_GRACE=(window.LSU_NET&&+window.LSU_NET.grace)||60000;
function netLive(peer){const q=peer&&netPeer(peer);return!!(q&&q.presence&&q.presence.gid===NET.gid);}
function netWaitLog(k,p,autoV,timeoutMs){
  const tok=gameToken;return new Promise(res=>{let t0=Date.now(),goneSince=null;
    const tick=()=>{if(tok!==gameToken)return;
      if(NET.log[k]!==undefined){res(NET.log[k]);return;}
      if(NET.host){if(p&&p.ctrl==='remote'){const q=netPeer(p.peer);const pr=q&&q.presence;const v=pr&&pr.gid===NET.gid&&pr.inp?pr.inp['k'+k]:undefined;
          if(v!==undefined){netRecord(k,{v});res(NET.log[k]);return;}
          if(!q){goneSince=goneSince||Date.now();setHint('Naputol si '+p.name+'. Hinihintay… '+Math.max(0,Math.ceil((NET_GRACE-(Date.now()-goneSince))/1000)));}
          else if(goneSince){goneSince=null;t0=Date.now();setHint('Hinihintay si '+p.name+'…');}
          if(goneSince?Date.now()-goneSince>NET_GRACE:Date.now()-t0>(timeoutMs||45000)){netRecord(k,{v:typeof autoV==='function'?autoV():autoV,a:1});res(NET.log[k]);return;}}}
      else{if(netHost()){NET.hostSeenAt=Date.now();if(NET.hostGone){NET.hostGone=false;toast('Bumalik ang host!','#C9F2B4',1400);}}
        else if(!NET.hostGone&&Date.now()-NET.hostSeenAt>3000){NET.hostGone=true;toast('Naputol ang host. Hinihintay na bumalik…','#fff',2600);}}

function lostConnection(msg){if(NET.gone&&APP.screen!=='game')return;NET.gone=true;gameToken++;scene=null;const c=openCard('<h2>Natapos ang laro</h2><p>'+esc(msg)+'</p><div class="row"><button type="button" class="btn primary" data-v="ok" data-primary>Bumalik sa menu</button></div>');cardChoice(c).then(()=>toTitle());}

/* ================= decisions (same order on every device) ================= */
async function decide(p,ui,botFn,autoV,timeoutMs){
  const tok=gameToken,k=++decK;
  if(p.ctrl==='bot')return await botFn();
  if(!NET.on)return await ui();
  if(p.ctrl==='local'){
    const logP=netWaitLog(k,p,autoV,timeoutMs);
    const first=await Promise.race([Promise.resolve().then(ui).then(v=>({v})),logP.then(r=>({log:r}))]);
    if(tok!==gameToken)await HALT;
    if(first.log){cancelLocalUI();return applyLog(p,first.log);}
    netInput(k,first.v);const r=await logP;if(tok!==gameToken)await HALT;return applyLog(p,r);
  }
  const prevHint=$('#hint').textContent;setHint('Hinihintay si '+p.name+'…');
  const r=await netWaitLog(k,p,autoV,timeoutMs);if(tok!==gameToken)await HALT;setHint(prevHint===('Hinihintay si '+p.name+'…')?'':prevHint);
  return applyLog(p,r);
}
function applyLog(p,r){if(r&&r.a&&p.ctrl!=='bot'){p.away=p.ctrl;p.ctrl='bot';toast(p.name+' ay bot na muna','#fff',1400);}return r?r.v:undefined;}
/* a seat a bot took over goes back to its player at the start of the next turn or minigame, if the player is in the room again.
   The host decides and records it in the log, so every device switches the seat at the same point of the game */
async function seatSync(){
  if(!NET.on||!state.players.some(p=>p.away))return;
  const tok=gameToken,k=++decK;
  if(NET.host&&NET.log[k]===undefined)netRecord(k,{v:state.players.filter(p=>p.away&&netLive(p.peer)).map(p=>p.id)});
  const r=await netWaitLog(k,null);if(tok!==gameToken)await HALT;
  for(const id of (r&&r.v)||[]){const p=state.players[id];if(p&&p.away){p.ctrl=p.away;p.away=null;toast(p.name+' ay bumalik!','#C9F2B4',1400);}}
}

async function hop(p,to,back){

  if(Math.abs(dy)>Math.abs(dx)*1.1){p.dir=dy<0?'back':'front';}else{p.dir='side';p.face=dx>=0?1:-1;}p.dirT=.8;
  Sfx.hop(back);const ox=p.offX,oy=p.offY;const prev=p.mood;p.mood=prev==='dizzy'?'dizzy':'hop';

/* how far the nearest korona is, and the chance a roll passes it (reach preview and bot choices) */
function koronaDist(p){let best=N;for(const i of korona.spots){const d=stepsTo(p.pos,i);if(d<best)best=d;}return best;}
function passChance(d,item){if(item==='ginto')return d<=10?1:0;if(item==='kendi')return clamp((14-d)/10,0,1);if(item==='doble'){let c=0;for(let a=1;a<=10;a++)for(let b=1;b<=10;b++)if(a+b>=d)c++;return c/100;}return clamp((11-d)/10,0,1);}
function rollRange(item,n){n=n||0;const r=item==='doble'?[2,20]:(item==='kendi'?[4,13]:[1,10]);return[r[0]+n,r[1]+2*n];}

function applyItemPreview(on){const p=dice.owner;if(!p||!p.item||ITEMS[p.item].passive)return;const it=p.item;dice.gold=on&&it==='ginto';dice.vals=on&&it==='doble'?[dice.vals[0],1]:[dice.vals[0]];dice.bonus=(it==='kendi'&&on)?3:0;if(state.reach)setReach(p,on?it:null);}
/* bots by difficulty: Madali uses items at once; Sakto and Mahirap save them for a korona they can afford, and always use them in the last round */
function botUsesItem(p){const it=p.item;if(!it||ITEMS[it].passive)return false;const diff=state.cfg.diff;
  if(diff===0||state.round>=maxR())return true;if(p.piso<KCOST)return false;
  const d=Math.max(1,Math.round(koronaDist(p)-1.5*p.allies.length));return passChance(d,it)-passChance(d,null)>=(diff===2?.15:.3)-1e-9;}
const SPACE_VAL={start:2,piso:2,swerte:3,sari:1,jack:1.5,kasama:2.5,tanong:2,utang:-2,tikbalang:-3,banda:2,kampana:3,munisipyo:2,rizal:2,tawad:2,timbangan:1.5,suki:2,basa:-1.5,ulan:0,alon:1.5,huli:2.5,taog:-1.5,buko:2,araw:-1.5,tanim:1.5,ani:3,balang:-2.5,bayanihan:1.5,kalesa:1,padyak:1,bangka:1,kalabaw:1};

function numberPick(p){const na=p.allies.length,d=Math.max(1,koronaDist(p)-na);let h='';for(let n=1;n<=10;n++){const i=walkMain(p.pos,n),k=korona.spots.includes(i);h+='<button type="button" class="btn" data-v="'+n+'"'+(n===Math.min(10,d)?' data-primary':'')+'><b>'+n+'</b><small>'+(n>=d?CROWN_SVG:'')+esc(k?'Korona':SPACE_SHORT[SP[i].type])+'</small></button>';}
  const c=openCard('<span class="chip">Gintong dice</span><h2>Ilang hakbang?</h2><p>Pumili ng bilang. Nakasulat kung saan ka titigil'+(d<=10?'. Kapag may maliit na korona, madadaanan mo ang korona.':'.')+(na?' Dagdag pa ng '+na+' hanggang '+2*na+' ang '+(na>1?'mga kasama':'kasama')+' mo.':'')+'</p><div class="numgrid">'+h+'</div>');return cardChoice(c).then(v=>+v);}
async function rollDice(p){

      return(active&&itemBtn.getAttribute('aria-pressed')==='true')?1:0;},
    async()=>{setHint('Nag-iisip si '+p.name+'…');const u=botUsesItem(p);if(u){await wait(400);applyItemPreview(true);}await wait(650+R()*450);setHint('');return u?1:0;},0);

function forkLabel(j){const s=SP[j];return s.id&&s.id[0]==='B'?'Ibang daan':'Diretso';}
async function chooseBranch(p,opts){
  let best=opts[0],bd=1e9;for(const j of opts){const d=Math.min(...korona.spots.map(k=>stepsTo(j,k)));if(d<bd){bd=d;best=j;}}
  if(state.cfg.diff===0&&G()<.5)best=opts[Math.floor(G()*opts.length)];
  const keep=dice.counter;dice.counter=null;
  const v=await decide(p,()=>ask({chip:'Sangandaan',title:isYou(p)?'Saan ka dadaan?':'Saan dadaan si '+p.name+'?',body:'Pumili ng daan. Nakasulat kung ilang hakbang ang pinakamalapit na korona sa bawat daan.',
      buttons:opts.map((j,k)=>({label:forkLabel(j)+' · '+Math.min(...korona.spots.map(q=>stepsTo(j,q)+1))+' hakbang sa korona',value:String(k),primary:j===best}))}),
    async()=>{await wait(350);return String(opts.indexOf(best));},String(opts.indexOf(best)),40000);

function rankPay(scores){const order=[0,1,2,3].sort((a,b)=>scores[b]-scores[a]||a-b);const pay=[0,0,0,0],rank=[0,0,0,0],T=[10,5,3,0];let r=0;order.forEach((pi,k)=>{if(k>0&&scores[pi]<scores[order[k-1]])r=k;rank[pi]=r;pay[pi]=T[r];});return{order,pay,rank};}
function dirFrom(dx,dy){if(Math.abs(dy)>Math.abs(dx)*1.05)return{dir:dy<0?'back':'front',face:1};return{dir:'side',face:dx>=0?1:-1};}

      const s=L.slip;

          if(s.u>=1){s.landed=true;s.h=0;s.t=0;if(s.hit){const c=L.can;c.st='fly';c.vx=Math.sin(s.a)*180+(R()-.5)*90;c.vy=-150-R()*60;c.vr=(R()<.5?-1:1)*(11+R()*6);c.t=0;L.hits++;hitstop=.07;

      if(c.st==='fly'){c.t+=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx*=1-dt*2.6;c.vy*=1-dt*2.6;c.rot+=c.vr*dt;c.vr*=1-dt*2.4;c.x=clamp(c.x,-50,50);c.y=Math.max(c.y,-198);if(c.t>.7){c.st='down';ty.st='fetch';}}
      if(ty.st==='fetch'||ty.st==='return'||ty.st==='home'){const tx=ty.st==='fetch'?c.x+10:(ty.st==='return'?14:30),tyy=ty.st==='fetch'?c.y+8:(ty.st==='return'?-128:-126);
        const dx=tx-ty.x,dy=tyy-ty.y,d=Math.hypot(dx,dy),sp=170*dt;ty.run+=dt*16;const df=dirFrom(dx,dy);ty.dir=df.dir;ty.face=df.face;
        if(d<=sp){ty.x=tx;ty.y=tyy;if(ty.st==='fetch'){ty.st='return';c.st='carried';}else if(ty.st==='return'){c.st='up';c.x=0;c.y=-140;c.rot=0;ty.st='home';L.cool=L.mode==='bot'?.5+R()*.9:.35;}else{ty.st='idle';ty.dir='front';ty.face=-1;}}

  };
  function drawCan(g,x,y,st,rot){

function mkPatintero(runner,mgi){

  sc.pointerUp=(x,y,id)=>{if(joy&&joy.id===id)joy=null;};

    run.x=0;run.y=194;run.dir=-1;run.crossed.clear();}
  sc.update=dt=>{
    if(cdTick(sc,dt))return;
    if(!sc.ended){sc.t+=dt;if(sc.t>=sc.T){sc.ended=true;Sfx.whistle();publish(false);setTimeout(()=>resolve({score:run.pts}),900);}}
    let ix=0,iy=0;if(keys.ArrowLeft||keys.KeyA)ix-=1;if(keys.ArrowRight||keys.KeyD)ix+=1;if(keys.ArrowUp||keys.KeyW)iy-=1;if(keys.ArrowDown||keys.KeyS)iy+=1;
    if(joy){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>6){const m=Math.min(1,d/45);ix=dx/d*m;iy=dy/d*m;}}

    run.vx=ix*175;run.vy=iy*175;const py=run.y;run.x=clamp(run.x+run.vx*dt,-F.hw+10,F.hw-10);run.y=clamp(run.y+run.vy*dt,F.top+8,F.bot-6);

    list.push({y:run.y,f:()=>{const fl=run.inv>0&&Math.floor(run.inv*10)%2===0;const moving=Math.hypot(run.vx,run.vy)>10;drawKid(g,hum,run.x,run.y,{walk:moving?run.run*.7:null,dir:moving?run.look:'front',face:run.face,mood:hum.mood,alpha:fl?.35:1,blink:hum.blink>0});

    const left=Math.max(0,sc.T-sc.t),w=230,x=W/2-w/2,y=topH+4;rr(g,x,y,w,34,17);fs(g,PAPER,INK,2.5);

function mkSipa(pre,mgi){
  let resolve;const L1=locals();
  const sc={kind:'sipa',view:{w:540,h:520},focusY:70,t:0,cd:3.6,ended:false,actionLabel:L1.length===1?'Sipa!':null,hint:L1.length===1?'Sumipa kapag umiilaw ang bilog':'I-tap malapit sa bilog mo kapag umilaw'};sc.done=new Promise(r=>resolve=r);
  /* WIN: the ring is lit for the last .27 s of each fall. A press up to BUF before it lights is kept (touch latency); earlier presses lock the foot, and mashing keeps it locked */

/* Pukpok Palayok: look at the pot, get blindfolded and spun, then count your steps and swing once. Three tries; every

const PALAYOK={LOOK:2,SPIN:.8,STEP:.55,RES:1.2,MAXS:12,SS:30,START:196,POTS:[5,7,9],CALLS:['Ayan na!','Palo na!','Ngayon na!','Hampas!','Dito na!','Sige, pukpok!']};

  for(const a of V)for(const b of V)for(const e of V){const n=a+b+e;if(n<R0[0]||n>R0[1])continue;const s=Math.abs(n-t);if(s<best){best=s;c.length=0;}if(s===best)c.push([a,b,e]);}return c[Math.floor(G()*c.length)];}
function mkPalayok(pre,mgi){

  const tries=P.POTS.map((b,k)=>{const pot=b+G()*.9,calls=[];
    if(k>0){const pick=()=>P.CALLS[Math.floor(G()*P.CALLS.length)],late=G()<.5;calls.push({at:pot-3.2+G()*1.6,txt:pick()},{at:late?pot+1.1+G()*.7:pot-1.45+G()*.5,txt:pick()});}
    return{pot,calls};});
  const lanes=state.players.map((p,i)=>({p,i,mode:p.ctrl,x:(i-1.5)*135,res:[],taps:[],tap:null,out:null,rt:0,done:false,plan:undefined,rip:0,sw:0,broke:0}));

  function drawPot(g,x,y,L){if(L.broke){for(let k=0;k<5;k++){const a=k*1.3;g.save();g.translate(x+Math.cos(a)*18,y+26+Math.sin(a)*5);g.rotate(a);g.beginPath();g.moveTo(-7,0);g.lineTo(5,-4);g.lineTo(7,3);g.closePath();fs(g,'#B8643A',INK,1.6);g.restore();}return;}

    ell(g,0,18,19,17);fs(g,'#C8743F',INK,2.4);rr(g,-10,-2,20,7,3);fs(g,'#A85A2C',INK,2);ell(g,-6,13,5,8);g.fillStyle='rgba(255,230,190,.35)';g.fill();g.beginPath();g.moveTo(-16,22);g.quadraticCurveTo(0,30,16,22);g.strokeStyle='#F2B21B';g.lineWidth=2.5;g.stroke();g.restore();}
  function drawPoles(g,L,y){for(const s of [-1,1]){rr(g,L.x+s*48-4,y-92,8,96,4);fs(g,'#B7A04A',INK,2);for(let k=1;k<4;k++){g.fillStyle='rgba(59,35,22,.35)';g.fillRect(L.x+s*48-4,y-92+k*24,8,2);}}

    for(let th=0;th<3;th++){const c=spots.map((s,k)=>k).filter(k=>third(k)===th);kids.push(c[Math.floor(G()*c.length)]);}
    const rest=sh(spots.map((s,k)=>k).filter(k=>!kids.includes(k)));kids.push(rest[0],rest[1]);
    const clues=sh(T.CLUES.slice());kids.forEach((k,i)=>{spots[k].kid={clue:clues[i%clues.length],look:Math.floor(G()*4)};});
    sh(rest.slice(2)).slice(0,R.fakes).forEach(k=>{spots[k].fake=T.FAKES[Math.floor(G()*T.FAKES.length)];});
    spots.forEach(s=>{s.at=G()*(R.stop-R.clue);});

  const kidKeys=[];yard.forEach((Y,r)=>Y.spots.forEach((s,k)=>{if(s.kid)kidKeys.push(r+':'+k);}));
  for(const pl of P)if(pl.mode==='bot'){const f=pre[pl.i].f,w=pre[pl.i].w,ks=kidKeys.slice().sort(()=>R()-.5).slice(0,f),es=[];yard.forEach((Y,r)=>Y.spots.forEach((s,k)=>{if(!s.kid)es.push(r+':'+k);}));
    pl.events=ks.map(k=>({key:k,hit:true})).concat(es.sort(()=>R()-.5).slice(0,w).map(k=>({key:k,hit:false})));}
  let r=0,rt=0;const R0=()=>yard[r].R,score=pl=>Math.max(0,Math.min(100,pl.found.size*10-pl.wrong*2));
  const arrive=k=>T.INTRO+k*(R0().stop+T.WALK)+T.WALK,roundLen=()=>arrive(yard[r].spots.length-1)+R0().stop+T.END;
  /* the spot whose stop (and the short walk after it) is now, or -1 */
  const cur=()=>{const R=R0(),n=yard[r].spots.length;if(rt<arrive(0))return -1;const k=Math.floor((rt-arrive(0))/(R.stop+T.WALK));return k<n?k:-1;};
  const tayaX=()=>{const S=yard[r].spots,R=R0();if(rt<T.INTRO)return S[0].x-T.GAP*.8;const k=Math.min(S.length-1,Math.floor((rt-T.INTRO)/(R.stop+T.WALK))),u=(rt-T.INTRO)-k*(R.stop+T.WALK);

  sc.update=dt=>{
    if(cdTick(sc,dt))return;sc.t+=dt;if(sc.ended)return;rt+=dt;
    for(const pl of P){if(pl.msg&&(pl.msg.t+=dt)>1.1)pl.msg=null;for(const q in pl.pop)pl.pop[q]+=dt;}
    const k=cur();
    for(const pl of P){if(pl.mode==='bot'){if(k>=0)for(const ev of pl.events)if(!ev.done&&ev.key===r+':'+k&&rt>=arrive(k)+yard[r].spots[k].at+.18){ev.done=1;if(ev.hit)pl.found.add(ev.key);else pl.wrong++;}}
      else if(pl.mode==='remote'){const m=netPeerMg(pl.p.peer,mgi);if(m){pl.rf=m.f|0;pl.rw=m.w|0;}}}
    if(rt>=roundLen()){if(r>=yard.length-1){sc.ended=true;P.forEach(pl=>publish(pl,false));setTimeout(()=>resolve({scores:P.map(pl=>pl.mode==='remote'?Math.max(0,Math.min(100,(pl.rf|0)*10-(pl.rw|0)*2)):score(pl))}),900);return;}
      r++;rt=0;Sfx.whistle();}
  };
  /* the screen: counters for bots and online players on top, then one strip per local player (the whole area for one) */
  function strips(){const others=P.filter(pl=>pl.mode!=='local'),loc=P.filter(pl=>pl.mode==='local'),top=topH+(others.length?34:4)+26,bot=H-botH-6,n=Math.max(1,loc.length),h=(bot-top)/n;
    return(loc.length?loc:[P[0]]).map((pl,j)=>({pl,x:0,y:top+j*h,w:W,h:h-(n>1?4:0)}));}
  sc.layout=()=>strips().map(s=>({x:s.x,y:s.y,w:s.w,h:s.h,scale:Math.min(s.h/190,s.w/440)}));
  const camX=()=>tayaX()+34;
  function strip2d(g,st){const sc2=Math.min(st.h/190,st.w/440),vw=st.w/sc2,x0=camX()-vw*.4,gy=Math.min(st.y+st.h*.82,st.y+st.h*.5+190*sc2*.3);

    const sky=g.createLinearGradient(0,st.y,0,gy);sky.addColorStop(0,'#FBD7A0');sky.addColorStop(1,'#FFF0D2');g.fillStyle=sky;g.fillRect(st.x,st.y,st.w,gy-st.y);
    g.fillStyle='#E9C995';for(let hx=Math.floor(x0*.5/160)*160;hx<x0*.5+vw;hx+=160){const sx=st.x+(hx-x0*.5)*sc2;rr(g,sx,gy-72*sc2,110*sc2,72*sc2,4);g.fill();g.beginPath();g.moveTo(sx-8*sc2,gy-70*sc2);g.lineTo(sx+55*sc2,gy-104*sc2);g.lineTo(sx+118*sc2,gy-70*sc2);g.closePath();g.fill();}
    g.fillStyle='#8DC85A';g.fillRect(st.x,gy-6*sc2,st.w,st.y+st.h-gy+6*sc2);g.fillStyle='#E0C08C';g.fillRect(st.x,gy+14*sc2,st.w,22*sc2);
    g.save();g.translate(st.x-x0*sc2,gy);g.scale(sc2,sc2);
    yard[r].spots.forEach((s,k)=>{if(s.x<x0-90||s.x>x0+vw+90)return;const key=r+':'+k,mine=st.pl.found.has(key)&&st.pl.mode==='local';
      const shake=s.kid&&s.kid.clue==='kaluskos'&&clueOn(k)&&!RM?Math.sin(rt*50)*2:0;g.save();g.translate(s.x+shake,0);TG_SPOTS[s.t][3](g);g.restore();
      if(mine){const u=Math.min(1,st.pl.pop[key]/.25);drawKid(g,NPCS[s.kid.look],s.x+TG_SPOTS[s.t][1]*.5+10,0,{scale:.9,lift:Math.sin(Math.PI*u)*18,mood:'cheer',face:-1});}});
    const ty=24,walking=rt>=T.INTRO&&cur()<0||((rt-T.INTRO)%(R0().stop+T.WALK))<T.WALK;
    drawKid(g,st.pl.p,tayaX(),ty,{dir:rt<T.INTRO?'back':'side',face:1,walk:walking&&rt>=T.INTRO?rt*12:null,mood:st.pl.p.mood,blink:st.pl.p.blink>0});
    g.restore();
    const k=cur();if(clueOn(k)&&!(st.pl.found.has(r+':'+k)&&st.pl.mode==='local')){const s=yard[r].spots[k],u=rt-arrive(k)-s.at,a=Math.min(1,u/.08,(R0().clue-u)/.08);drawClue(g,s,st.x+(s.x-x0)*sc2,gy,sc2,a,rt);}
    g.restore();}
  function stripHud(g,st){const pl=st.pl,sm=st.h<130;g.font='900 '+(sm?12:13)+'px '+BODY;const nm=pl.p.name+' · '+pl.found.size+' nahanap',tw=g.measureText(nm).width+22;rr(g,st.x+8,st.y+6,tw,22,11);fs(g,'rgba(255,246,230,.94)',INK,2);
    g.beginPath();g.arc(st.x+19,st.y+17,4.5,0,TAU);fs(g,pl.p.color);g.fillStyle=INK;g.textAlign='left';g.textBaseline='middle';g.fillText(nm,st.x+28,st.y+17.5);
    const kl=keyLabel(pl.p);if(kl){g.font='900 11px '+BODY;g.fillStyle='rgba(59,35,22,.7)';g.fillText('['+kl+']',st.x+tw+14,st.y+17.5);}
    const k=cur(),lk=pl.lockR===r&&k>=0&&k<=pl.lock;if(lk){const left=pl.lock-k+1;g.font='900 12px '+BODY;const t='Nalito · '+left;const w2=g.measureText(t).width+18;rr(g,st.x+st.w-w2-8,st.y+6,w2,22,11);fs(g,'#FFD6CF',INK,2);g.fillStyle='#A92A18';g.textAlign='center';g.fillText(t,st.x+st.w-w2/2-8,st.y+17.5);}

async function runMinigame(kind,opt){
  opt=opt||{};
  await seatSync();
  const tok=gameToken,def=MG[kind]||MG.tumbang,mgi=++mgSeq,P=state.players;
  const pre=P.map(()=>def.preroll(state.cfg.diff));
  const mult=(isParty()&&state.round===maxR()&&maxR()>=3)?2:1;
  state.active=null;updateStatus('Laro: '+def.title);
  if(!opt.hamon)await say(mult>1?'Huling Hirit: doble ang premyo!':'Oras ng laro!','#FFC93C',1100);
  await ask({chip:def.chip,title:def.title,aka:def.aka,list:def.rules,html:realBox(def),ctrl:mgCtrl(kind),buttons:[{label:'Simulan',value:'go',primary:true}],autoMs:NET.on?9000:0});
  if(tok!==gameToken)await HALT;
  const localScores={};
  if(kind==='patintero'){
    const runners=locals();
    for(let ri=0;ri<runners.length;ri++){const rp=runners[ri];
      if(ri>0){actionBtn.hidden=true;await ask({title:'Turn ni '+rp.name,body:'Si '+rp.name+' na ang tatakbo. Iabot ang phone.',buttons:[{label:'Takbo!',value:'go',primary:true}]});if(tok!==gameToken)await HALT;}
      let sc;await iris(()=>{sc=mkPatintero(rp,mgi);enterScene(sc);});if(tok!==gameToken)await HALT;
      const r=await sc.done;if(tok!==gameToken)await HALT;localScores[rp.id]=r.score;
    }
  }else{
    let sc;await iris(()=>{sc=def.make(pre,mgi);enterScene(sc);});
    const r=await sc.done;if(tok!==gameToken)await HALT;for(const p of locals())localScores[p.id]=r.scores[p.id];
  }
  actionBtn.hidden=true;
  if(P.some(p=>p.ctrl==='remote'))setHint('Hinihintay ang iskor ng iba…');
  const scores=[];
  for(const p of P){const v=await decide(p,async()=>localScores[p.id]||0,async()=>def.botScore(pre[p.id]),()=>{const m=netPeerMg(p.peer,mgi);return m?(m.s|0):0;},45000);scores[p.id]=Number(v)||0;}
  setHint('');
  const rp=rankPay(scores),pay=rp.pay.map(v=>v*mult);dbg('mg',{kind,scores:scores.slice(),pay:pay.slice()});const top=P.filter(p=>rp.rank[p.id]===0);
  top.forEach(p=>p.stats.wins++);
  if(opt.hamon)return{scores,rank:rp.rank};
  const title=top.length>1?'Tabla sa una!':(isYou(top[0])?'Panalo ka!':'Panalo si '+top[0].name+'!');
  if(top.some(p=>p.ctrl==='local')){Sfx.fanfare();buzz([40,60,40]);}
  const rows=rp.order.map(i=>({pos:rp.rank[i]+1,color:P[i].color,name:P[i].name,score:scores[i]+' '+def.unit,pay:pay[i]?'+'+pay[i]:'—',crown:isTorneo()&&rp.rank[i]===0}));
  const note=mult>1?'<p class="note">Huling Hirit: doble ang piso sa larong ito.</p>':(isTorneo()?'<p class="note">May korona ang nanalo. Piso ang batayan kapag tabla sa korona.</p>':'');
  const newStamp=locals().length?stampGame(kind):false;
  await ask({title,html:rankRows(rows)+note+labasBox(def)+(newStamp?'<p class="note">Bagong tatak sa Pasaporte: '+esc(def.title)+'!</p>':''),buttons:[{label:'Tuloy',value:'ok',primary:true}],autoMs:NET.on?8000:0});
  if(tok!==gameToken)await HALT;
  await iris(()=>{state.players.forEach(p=>{p.mood='idle';p.moodT=0;});scene=null;parts.length=0;floats.length=0;mapBtn.hidden=false;state.overview=false;state.focus={x:860,y:780};cam.x=860;cam.y=780;cam.z=boardZoom()*.8;setHint('');Music.play('board');});
  await wait(300);
  for(const p of P){if(pay[p.id]>0){p.piso+=pay[p.id];coinFly(p,pay[p.id]);burst(p.x,p.y-30,8,'coin',{up:true,spd:220,g:520,size:5});floatText('+'+pay[p.id],p.x,p.y-70,'#FFE07A',22);setMood(p,'happy',1);}}
  if(isTorneo()&&top.length){for(const p of top){p.korona++;floatText('+1 korona',p.x,p.y-104,'#FFC93C',22);setMood(p,'cheer',1.4);burst(p.x,p.y-90,10,'star',{spd:160,size:6,color:'#FFC93C'});}Sfx.fanfare();}
  tip('pay',isTorneo()?'Sa Torneo, may korona ang mananalo sa bawat laro. Piso ang batayan kapag tabla.':'Sa bawat laro: +10 piso sa una, +5 sa ikalawa, +3 sa ikatlo. Gamitin ang piso para sa korona.');
  Sfx.coin();await wait(1100);state.focus=null;
}

/* end-of-party bonus korona: computed from what happened, so every device agrees */
function bonusList(){const P=state.players;const mk=(name,desc,val,best)=>{const vals=P.map(val);const tgt=best(...vals);const w=P.filter((p,i)=>vals[i]===tgt);return w.length&&w.length<P.length?{name,desc,w,val:tgt}:null;};
  const avg=p=>p.stats.dn?Math.round(p.stats.dice/p.stats.dn*100)/100:99;
  return[mk('Hari ng Laro','Pinakamaraming panalo sa mga laro',p=>p.stats.wins,Math.max),mk('Mayaman','Pinakamaraming piso sa dulo',p=>p.piso,Math.max),mk('Malas sa Dice','Pinakamababang average ng dice',avg,Math.min)].filter(Boolean).filter(b=>!(b.name==='Hari ng Laro'&&b.val===0)&&b.val!==99);}
async function bonusAwards(tok){
  const list=bonusList();dbg('bonus',{list:list.map(b=>({name:b.name,w:b.w.map(p=>p.id)}))});if(!list.length)return;
  await say('Mga bonus na korona!','#FFC93C',1300);if(tok!==gameToken)return;
  const html='<ol class="rank">'+list.map(b=>'<li><span class="pos">+1</span><span class="dot" style="background:'+b.w[0].color+'"></span><span class="who">'+esc(b.name)+'</span><span class="sc">'+esc(b.w.map(p=>p.name).join(', '))+'</span><span class="pay">'+CROWN_SVG+'</span></li>').join('')+'</ol><p class="note">'+list.map(b=>esc(b.name)+': '+esc(b.desc.toLowerCase())+'.').join(' ')+'</p>';
  await ask({title:'Bonus na korona',html,buttons:[{label:'Tingnan ang panalo',value:'ok',primary:true}],autoMs:NET.on?9000:0});
  if(tok!==gameToken)return;
  for(const b of list)for(const p of b.w){p.korona++;floatText('+1 korona',p.x,p.y-90,'#FFC93C',22);setMood(p,'cheer',1.2);burst(p.x,p.y-80,10,'star',{spd:150,size:6,color:'#FFC93C'});}
  Sfx.fanfare();await wait(1400);
}

async function hulingHirit(){
  await say('Huling Hirit!','#FFC93C',1200);
  const last=[...state.players].sort((a,b)=>a.korona-b.korona||a.piso-b.piso||b.id-a.id)[0];
  if(!last.item){last.item='doble';floatText('Libreng Dobleng dice!',last.x,last.y-80,'#fff',20);}else{last.piso+=5;coinFly(last,5);floatText('+5',last.x,last.y-70,'#FFE07A',22);}
  setMood(last,'happy',1.4);Sfx.coin();
  await say('Tulong kay '+last.name+', at doble ang premyo sa huling laro!','#fff',1900);
}
async function gameLoop(startRound,startTurn,token){
  for(let r=startRound;r<=maxR();r++){
    if(token!==gameToken)return;state.round=r;updateStatus();
    if(isTorneo()){
      if(r===1&&startTurn!==4)tip('torneo','Torneo: walang dice. Bawat panalo sa laro ay isang korona; piso ang batayan kapag tabla.');
      await say(r===maxR()?'Huling laro!':'Laro '+r+' ng '+maxR(),'#FFC93C',1100);if(token!==gameToken)return;
      state.turn=4;checkpoint();await runMinigame(state.plan[r-1]);startTurn=0;continue;}
    if(r===1&&startTurn===0){tip('goal','Layunin: pinakamaraming korona sa dulo ng laro. Dumaan sa korona na may 10 piso para bumili.');await say('Bunutan: una si '+state.players[state.order[0]].name+'!','#FFE07A',1300);if(token!==gameToken)return;}
    if(startTurn===0&&r>1)await say(r===maxR()?'Huling ikot!':'Ikot '+r,'#FFC93C',1100);
    if(startTurn===0&&r===maxR()&&maxR()>=3)await hulingHirit();
    for(let i=startTurn;i<4;i++){if(token!==gameToken)return;state.turn=i;checkpoint();await playTurn(state.players[state.order[i]]);}
    startTurn=0;state.turn=4;checkpoint();
    if(token!==gameToken)return;await runMinigame(state.plan[r-1]);
  }
  if(token===gameToken)await finale();
}

const LB_KEY='lsu-lb';let LB_MEM=null,HAMON_NAME='';
function lbGet(){if(LB_MEM)return LB_MEM;try{const o=JSON.parse(localStorage.getItem(LB_KEY)||'{}');return o&&typeof o==='object'?o:{};}catch(e){return{};}}
function lbAdd(kind,entry){const o=lbGet();o[kind]=(Array.isArray(o[kind])?o[kind]:[]).concat([entry]).sort((x,y)=>y.s-x.s||x.t-y.t).slice(0,12);try{localStorage.setItem(LB_KEY,JSON.stringify(o));}catch(e){LB_MEM=o;}return o[kind];}
function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function prettyDay(){const d=new Date(),M=['Ene','Peb','Mar','Abr','May','Hun','Hul','Ago','Set','Okt','Nob','Dis'];return M[d.getMonth()]+' '+d.getDate();}
function dayNum(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
function dailyKind(){return MG_KEYS[dayNum()%MG_KEYS.length];}
function dailySeed(){let h=2166136261;const k='lsu-'+dayKey();for(let i=0;i<k.length;i++){h^=k.charCodeAt(i);h=Math.imul(h,16777619);}return(h|0)||7;}
function hamonName(){return HAMON_NAME||(state.setup&&state.setup.names&&state.setup.names[0])||NET.name||CHARS[0].name;}
function lbEntries(kind,daily){const a=lbGet()[kind]||[];return daily?a.filter(e=>e.daily&&e.d===dayKey()):a;}

   project F7 already connects to. Needs the daily_scores table from the Phase 3
   schema draft (supabase/) to actually exist on that project; until then every call

let last=performance.now(),frameN=0,jeepT=2;
function update(dt){
  if(PAUSED){updCam(dt);return;}
  now+=dt;
  if(hitstop>0){hitstop-=dt;updCam(dt);return;}
  let gdt=dt;if(NET.on&&!NET.host&&!scene&&NET.logMax-decK>=2)gdt=dt*3;
  else if(!NET.on&&!scene&&APP.screen==='game'&&state.active&&state.active.ctrl==='bot'&&!topDialog())gdt=dt*(state.fast?2.6:1.35);
  updTweens(gdt);if(scene&&APP.screen==='game')scene.update(dt);
  if(dice.on&&dice.spin&&!dice.gold){dice.tick-=dt;if(dice.tick<=0){dice.tick=.07;dice.vals=dice.vals.map(()=>1+Math.floor(R()*10));}}
  updPlayers(gdt);updFX(dt);updFlyers(dt);
  for(const s of SP)if(s.pulse>0)s.pulse=Math.max(0,s.pulse-dt*2.2);
  for(const b of BIRDS){b.x+=b.v*dt;if(b.x>1900)b.x=-200;if(b.x<-200)b.x=1900;}
  if(state.party&&R()<dt*10){const p=state.players.find(q=>q.mood==='cheer')||state.players[0];burst(p.x+(R()-.5)*60,p.y-120,6,'confetti',{spd:160,g:220,life:1.4,size:7});}
  if(!scene&&!RM){jeepT-=dt;if(jeepT<0){jeepT=2+R()*1.5;const pj=propPos(PROPS[5]);burst(pj.x-40,pj.y-8,2,'dust',{spd:22,life:.9,size:6,g:-40});}}

}

/* ================= title scene: the Plaza at golden hour behind the main menu (maps/title.js) =================

const TS={ctl:null,mk:null,tok:0,on:false,bg:$('#titleBg'),cv:$('#titleCv')};
async function titleBuild(){const tok=++TS.tok;try{await loadThree();
    const [geo,m]=await Promise.all([import('./kids/kidgeo.js'),import('./maps/title.js')]);if(tok!==TS.tok)return;const Q=gq();if(geo.LOD)geo.LOD.k=Q.kid;
    const ctl=TS.mk=m.create(TS.cv,{reduced:RM,maxDpr:Q.pr,shadow:Q.shadow,islShadow:Q.isl,leaf:Math.min(2500,Q.leaf),grass:Math.min(6,Q.grass)});await ctl.ready;if(tok!==TS.tok)return;
