<!doctype html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laro sa Ulap</title>
<meta name="description" content="Laro sa Ulap: isang party board game ng mga larong kalye ng Pilipinas para sa 1 hanggang 4 na manlalaro.">
<meta name="theme-color" content="#9DD6DF">
<meta name="claude:viewport-fit-sides" content="cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one full-bleed canvas world (sky, floating islands, minigame arenas); DOM "stickers" float on top: title menu, players across the top, actions along the bottom, cards in the middle. Deliberately one daytime look. */
:root{
  --ink:#3B2316;
  --paper:#FFF6E6;
  --sand:#F6E7CC;
  --muted:#7A5A44;
  --sky:#9DD6DF;
  --sun:#FFC93C;
  --leaf:#BDE7A6;
  --red:#E2452E;
  --blue:#2E6FD8;
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  --banig:repeating-linear-gradient(45deg,rgba(226,69,46,.9) 0 7px,transparent 7px 14px),repeating-linear-gradient(-45deg,#F2B21B 0 7px,#2E6FD8 7px 14px);
  color-scheme: light;
}
html,body{height:100%}
button,input{touch-action:manipulation}
body{background:var(--sky);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 14px}
.top{display:flex;flex-direction:column;align-items:center;gap:7px}
.players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;width:100%;max-width:620px}
.pcard{--pc:#999;background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);
  padding:5px 7px 6px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:5px;align-items:center;min-width:0;
  transition:transform .2s ease, box-shadow .2s ease}
.pcard canvas{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:block}
.pcard .nm{font-weight:900;font-size:13px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pcard .role{display:block;font-size:9.5px;font-weight:900;color:var(--muted);letter-spacing:.02em;line-height:1}
.pcard .st{grid-column:1 / -1;display:flex;gap:9px;margin-top:4px;font-family:var(--display);font-size:15px;line-height:1;font-variant-numeric:tabular-nums}
.pcard .st span{display:inline-flex;align-items:center;gap:3px}
.pcard .it{font-family:var(--body);font-weight:900;font-size:10px;background:var(--ink);color:var(--paper);border-radius:6px;padding:1px 4px;margin-left:auto}
.pcard.active{transform:translateY(3px);box-shadow:0 0 0 3px var(--pc),0 3px 0 3px var(--ink)}
.pcard{position:relative}
.pcard .rk{position:absolute;top:-8px;right:-7px;min-width:21px;height:21px;padding:0 3px;border-radius:999px;background:var(--paper);border:2px solid var(--ink);font:400 12px/17px var(--display);text-align:center;box-shadow:0 2px 0 var(--ink)}
.pcard .rk.first{background:var(--sun)}
.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:scale(1.3)}}
.status{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.pill{background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:3px 11px;font-weight:900;font-size:13px;
  box-shadow:0 2px 0 var(--ink);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill b{font-family:var(--display);font-weight:400;font-size:14px}
.bottom{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:auto}
.btn{pointer-events:auto;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.05;color:var(--ink);background:var(--paper);
  border:3px solid var(--ink);border-radius:16px;padding:12px 16px;box-shadow:0 5px 0 var(--ink);cursor:pointer;
  transition:transform .08s ease, box-shadow .08s ease, background-color .15s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.btn.primary{background:var(--sun);padding:13px 20px}
.btn.leaf{background:var(--leaf)}
.btn.small{font-size:15px;padding:9px 13px;box-shadow:0 4px 0 var(--ink)}
.btn.icon{width:48px;height:48px;padding:0;display:grid;place-items:center;border-radius:14px}
.btn.icon svg{width:24px;height:24px}
.btn.item{font-size:14px;padding:10px 12px;background:var(--sand)}
.btn[aria-pressed="true"].item{background:var(--leaf)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--ink)}
.hint{font-size:13px}
.toast{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(24px,6.4vw,38px);
  line-height:1.05;text-align:center;width:max-content;max-width:calc(100% - 32px);color:#fff;opacity:0;pointer-events:none;transition:opacity .25s;z-index:3;
  text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink)}
.toast.show{opacity:1;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4)}to{transform:translate(-50%,-50%) scale(1)}}

.screen{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.screen.bottomed{align-items:flex-end}
.titlebox{pointer-events:auto;width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
#kidsCv{width:100%;max-width:300px;height:118px;display:block}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(46px,14vw,66px);line-height:.92;color:var(--paper);margin:0;transform:rotate(-3deg);text-wrap:balance;
  text-shadow:0 7px 0 var(--ink),4px 0 0 var(--ink),-4px 0 0 var(--ink),0 -4px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),4px 6px 0 var(--ink),-4px 6px 0 var(--ink)}
.logo span{color:var(--sun)}
.tagline{font-weight:900;font-size:14px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 var(--ink);margin:6px 0 8px}
.brand{display:flex;flex-direction:column;align-items:center;width:100%;min-width:0}
.menu{display:flex;flex-direction:column;gap:12px;width:100%}
.menu .btn{width:100%}
.menu .btn small{display:block;margin-top:3px;font:800 12.5px var(--body);color:var(--muted)}

.galpanel{pointer-events:auto;width:100%;max-width:620px;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:900 13px var(--body);color:var(--ink);background:var(--sand);border:2px solid var(--ink);border-radius:999px;padding:7px 12px;min-height:36px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--sun)}
.chips button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.galrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.galnote{margin:8px 2px 0;font-size:12.5px;font-weight:800;color:var(--muted)}

.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(59,35,22,.4);z-index:6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);width:100%;max-width:380px;min-width:0;
  padding:0 18px 16px;max-height:100%;overflow:auto;animation:cardin .3s cubic-bezier(.3,1.4,.5,1)}
.card::before{content:"";display:block;height:11px;margin:0 -18px 14px;background:var(--banig);border-bottom:2.5px solid var(--ink)}
@keyframes cardin{from{transform:translateY(16px) scale(.94);opacity:0}}
.card h2{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.02;margin:0 0 4px;text-wrap:balance}
.card .aka{font-size:13px;font-weight:800;color:var(--muted);margin:0 0 8px}
.card .chip{display:inline-block;font-weight:900;font-size:12px;background:var(--ink);color:var(--paper);border-radius:999px;padding:3px 10px;margin-bottom:6px}
.card p{font-weight:700;font-size:15px;line-height:1.45;margin:6px 0}
.card ul{margin:8px 0 6px;padding-left:20px;font-weight:700;font-size:15px;line-height:1.45}
.card li{margin:3px 0}
.card .ctrl,.card .note{font-size:13px;color:var(--muted)}
.card .row{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.card .row .btn{flex:1 1 auto}
.rank{list-style:none;padding:0;margin:10px 0 2px;display:grid;gap:6px}
.rank li{display:grid;grid-template-columns:22px 14px minmax(0,1fr) auto auto;align-items:center;gap:8px;background:var(--sand);border-radius:12px;padding:6px 10px;margin:0}
.rank .pos{font-family:var(--display);font-size:16px}
.rank .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink)}
.rank .who{font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .sc{font-weight:800;font-size:13px;color:var(--muted);white-space:nowrap}
.rank .pay{font-family:var(--display);font-size:15px;white-space:nowrap}
.hands{display:flex;gap:8px;margin-top:12px}
.hands .btn{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:15px;padding:10px 6px}
.hands svg{width:44px;height:44px}
.jk{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:10px;text-align:center}
.jk .who{font-weight:900;font-size:14px}
.jk svg{width:56px;height:56px}
.jk .vs{font-family:var(--display);font-size:18px}
.big{font-family:var(--display);font-size:34px;text-align:center;margin:10px 0 2px;min-height:40px}
.seg{display:flex;gap:6px;margin:8px 0 6px}
.seg button{flex:1 1 0;min-height:40px;font:400 20px var(--display);color:var(--ink);background:var(--sand);border:2.5px solid var(--ink);border-radius:12px;padding:8px 0;box-shadow:0 3px 0 var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--sun)}
.seg button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.field{display:flex;align-items:center;gap:8px;margin:7px 0}
.field .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink)}
.field label{font-weight:900;font-size:13px;color:var(--muted);flex:none}
.field input{flex:1 1 auto;min-width:0;font:800 16px var(--body);color:var(--ink);padding:9px 11px;border:2.5px solid var(--ink);border-radius:12px;background:#fff}
.field input:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.field .bot{flex:1 1 auto;font-weight:800;color:var(--muted);padding:9px 2px}
.codebig{font-family:var(--display);font-size:46px;letter-spacing:.14em;text-align:center;margin:2px 0 0;font-variant-numeric:tabular-nums}
.qr{display:block;margin:8px auto 4px;width:172px;height:172px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;image-rendering:pixelated}
.linkrow{display:flex;gap:6px;align-items:center;margin-top:6px}
.linkrow code{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 12px ui-monospace,Menlo,Consolas,monospace;background:var(--sand);padding:7px 9px;border-radius:9px;user-select:text;-webkit-user-select:text}
.linkrow .btn{flex:none}
.err{font-weight:800;font-size:14px;color:#A92A18;margin:6px 0}
.modal.top{z-index:7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.btn.sky{background:#BFE3F2}
.menurow{display:flex;gap:10px;width:100%}
.menurow .btn{flex:1 1 0;min-width:0}
.tip{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:min(360px,calc(100% - 32px));
  background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);padding:8px 12px;font-weight:800;font-size:13.5px;line-height:1.35;
  display:flex;gap:8px;align-items:flex-start;pointer-events:auto;cursor:pointer;z-index:2}
.tip.show{animation:tipin .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes tipin{from{transform:translateX(-50%) translateY(10px);opacity:0}}
.tipb{flex:none;font-family:var(--display);font-weight:400;font-size:12px;background:var(--sun);border:2px solid var(--ink);border-radius:8px;padding:1px 6px;margin-top:1px}
.real{background:var(--sand);border:2px dashed rgba(59,35,22,.35);border-radius:12px;padding:8px 11px;margin:10px 0 4px}
.real b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.real p{font-size:13.5px;line-height:1.45;margin:3px 0 0}
.setrow{display:grid;grid-template-columns:88px minmax(0,1fr);align-items:center;gap:8px;margin:7px 0}
.setlbl{font-weight:900;font-size:13px;color:var(--muted);line-height:1.15}
.seg.sm{margin:0}
.seg.sm button{font:900 14px var(--body);padding:8px 2px;box-shadow:0 2px 0 var(--ink);min-width:0}
.legend,.steps{margin:8px 0 6px;padding-left:0;list-style:none;font-weight:700;font-size:14.5px;line-height:1.4;display:grid;gap:6px}
.steps{list-style:decimal;padding-left:20px}
.legend li{display:grid;grid-template-columns:14px 96px minmax(0,1fr);gap:8px;align-items:baseline}
.legend b{white-space:nowrap}
.legend .sw{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);transform:translateY(2px)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pgrid .btn{display:flex;flex-direction:column;gap:3px;font-size:17px;padding:10px 8px}
.pgrid small{font:800 11.5px var(--body);color:var(--muted)}
.lbh{font-weight:900;font-size:13px;margin:12px 0 0}
.lbh span{color:var(--muted);font-weight:800}
.rank.lb li{padding:4px 10px}
@media (max-height:700px){
  #kidsCv{height:92px}
  .logo{font-size:clamp(40px,12vw,56px)}
  .menu{gap:9px}
  .menu .btn{padding-block:10px}
}
@media (max-width:440px){
  .players{gap:5px}
  .pcard{padding:4px 5px 5px;border-radius:12px}
  .pcard canvas{width:22px;height:22px}
  .pcard .nm{font-size:11.5px}
  .pcard .st{font-size:13px;gap:6px}
  .pill{font-size:12px;padding:2px 9px}
  .btn.primary{font-size:17px;padding:12px 15px}
  .setrow{grid-template-columns:70px minmax(0,1fr)}
  .seg.sm button{font-size:13px;padding-inline:0}
}
/* narrow phones: the shirt colour moves to a side stripe so the full name fits */
@media (max-width:400px){
  .pcard{grid-template-columns:minmax(0,1fr);border-left:7px solid var(--pc)}
  .pcard canvas{display:none}
}
/* phones held sideways: brand beside the menu, one compact HUD row */
@media (orientation:landscape) and (max-height:560px){
  .titlebox{max-width:700px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:28px;align-items:center}
  #kidsCv{height:80px}
  .logo{font-size:clamp(34px,6.4vw,50px)}
  .tagline{margin:4px 0 0}
  .menu{gap:8px}
  .menu .btn{padding-block:8px;font-size:17px}
  .menu .btn.small{font-size:14px;padding-block:8px}
}
@media (orientation:landscape) and (max-height:500px){
  .hud{padding-block:6px 8px}
  .top{flex-direction:row;align-items:flex-start;justify-content:center;gap:8px}
  .players{max-width:min(560px,64vw)}
  .status{flex-direction:column;align-items:flex-start;flex-wrap:nowrap;gap:4px}
  .pcard{padding:3px 6px 4px}
  .pcard .st{margin-top:2px}
  .btn.icon{width:44px;height:44px;border-radius:12px}
  .btn.primary{padding:9px 18px;font-size:17px}
  .btn.item{padding:8px 10px}
  .tip{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(66px + env(safe-area-inset-bottom,0px));transform:none;max-width:min(320px,40vw)}
  .tip.show{animation-name:tipinL}
  .toast{top:42%}
}
@keyframes tipinL{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion: reduce){
  .toast.show,.card,.bump,.tip.show{animation:none}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="stage" role="img" aria-label="Game board: four floating islands in the clouds joined by rope bridges"></canvas>
  <div class="hud">
    <div class="top" id="hudTop" hidden>
      <div class="players" id="players"></div>
      <div class="status">
        <span class="pill" id="roundPill">Ikot <b>1/5</b></span>
        <span class="pill" id="turnPill">Laro</span>
        <span class="pill" id="koronaPill"><svg viewBox="0 0 24 18" width="16" height="12" aria-hidden="true"><path d="M2 16h20l1-11-6 5-5-8-5 8-6-5z" fill="#FFC93C" stroke="#3B2316" stroke-width="2" stroke-linejoin="round"/></svg><span id="koronaWhere">Plaza</span></span>
      </div>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="tip" id="tip" role="status" hidden><span class="tipb">Tip</span><span id="tipText"></span></div>
    <div class="bottom" id="hudBottom">
      <button class="btn icon" id="menuBtn" type="button" aria-label="Menu: pause, tunog, umalis" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="#3B2316" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4.5" width="5" height="15" rx="1.6" fill="#FFC93C"/><rect x="14" y="4.5" width="5" height="15" rx="1.6" fill="#FFC93C"/></svg>
      </button>
      <button class="btn icon" id="mapBtn" type="button" aria-pressed="false" aria-label="Tingnan ang buong mapa" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="#3B2316" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" fill="#BDE7A6"/><path d="M9 4v14M15 6v14"/></svg>
      </button>
      <span class="pill hint" id="hint" hidden></span>
      <button class="btn item" id="itemBtn" type="button" aria-pressed="false" hidden>Gamitin</button>
      <button class="btn primary" id="actionBtn" type="button" hidden>Tamaan ang dice</button>
      <button class="btn icon" id="soundBtn" type="button" aria-pressed="true" aria-label="Tunog">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3B2316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#FFC93C"/><path id="sndWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="sndOff" d="M17 9l5 6M22 9l-5 6" style="display:none"/></svg>
      </button>
    </div>
  </div>
  <div class="screen" id="scrTitle">
    <div class="titlebox">
      <div class="brand">
        <canvas id="kidsCv" aria-hidden="true"></canvas>
        <h1 class="logo">Laro sa <span>Ulap</span></h1>
        <p class="tagline">Board party ng larong kalye</p>
      </div>
      <div class="menu">
        <button class="btn leaf" id="mResume" type="button" hidden>Ituloy ang laro<small id="mResumeSub"></small></button>
        <button class="btn primary" id="mLocal" type="button">Maglaro</button>
        <button class="btn" id="mOnline" type="button">Maglaro online</button>
        <button class="btn sky" id="mHamon" type="button">Hamon ng Araw</button>
        <div class="menurow"><button class="btn small" id="mGuide" type="button">Paano maglaro</button><button class="btn small" id="mSprites" type="button">Mga karakter</button></div>

const parts=[],floats=[];
function burst(x,y,n,type,o){o=o||{};for(let i=0;i<n;i++){const a=o.up?(-Math.PI/2+(R()-.5)*1.6):R()*TAU,sp=(o.spd||120)*(.5+R()*.7);

function updFX(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>=p.max){parts.splice(i,1);continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*1.5;p.rot+=p.vr*dt;if(p.type==='dust'){p.vy*=1-dt*4;}}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life+=dt;f.y-=dt*42;if(f.life>=f.max)floats.splice(i,1);}}
function drawFX(g){
  for(const p of parts){const a=1-p.life/p.max;g.save();g.globalAlpha=Math.min(1,a*1.4);g.translate(p.x,p.y);g.rotate(p.rot);
    if(p.type==='coin'){ell(g,0,0,p.size,p.size*.85*Math.abs(Math.cos(p.rot*2))+1);fs(g,'#FFD34D',INK,1.5);}
    else if(p.type==='star'){star(g,0,0,p.size,p.size*.45,5);fs(g,p.color,INK,1.2);}
    else if(p.type==='confetti'){g.fillStyle=p.color;g.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);}
    else if(p.type==='dust'){g.globalAlpha=a*.6;g.beginPath();g.arc(0,0,p.size*(1.6-a*.6),0,TAU);g.fillStyle='#F3E6CC';g.fill();}
    else{g.beginPath();g.arc(0,0,p.size*.5,0,TAU);g.fillStyle=p.color;g.fill();}
    g.restore();}
  for(const f of floats){const u=f.life/f.max,s=u<.15?Ez.back(u/.15):1;g.save();g.globalAlpha=u>.7?1-(u-.7)/.3:1;g.translate(f.x,f.y);g.scale(s,s);otext(g,f.text,0,0,f.size,f.color);g.restore();}
}

const NET={cfg:null,on:false,host:false,rm:null,code:'',my:null,hostPeer:null,hostSeenAt:0,gid:'',log:{},logMax:0,inp:{},peers:[],seen:new Map(),roster:[],rosterKey:'',name:'',started:'',onUpdate:null,unsub:null,gone:false,mgAt:0};
function cleanName(s){return String(s||'').replace(/[^\p{L}\p{N} ._'-]/gu,'').replace(/\s+/g,' ').trim().slice(0,12);}
function makeCode(){const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=A[Math.floor(R()*A.length)];return s;}
async function netRoom(){try{if(!window.claude||!window.claude.use)return null;return await window.claude.use('room');}catch(e){return null;}}
async function netJoin(code){
  const room=await netRoom();if(!room)throw new Error('noroom');
  const rm=await room.join('lsu-'+code.toLowerCase());NET.rm=rm;NET.code=code;NET.seen=new Map();NET.peers=rm.peers()||[];
  NET.unsub=rm.onPeers(ch=>onNetPeers(ch),e=>netTerminal(e));return rm;
}
function netPres(patch){if(NET.rm)NET.rm.presence(patch).catch(()=>{});}
function netLeave(){try{NET.unsub&&NET.unsub();}catch(e){}const rm=NET.rm;Object.assign(NET,{on:false,host:false,rm:null,code:'',hostPeer:null,gid:'',log:{},logMax:0,inp:{},roster:[],rosterKey:'',started:'',onUpdate:null,unsub:null,gone:false});try{rm&&rm.leave().catch(()=>{});}catch(e){}}
function netPeer(peer){return NET.peers.find(q=>q.peer===peer);}
function myPeer(){if(!NET.my&&NET.rm){try{const me=(NET.rm.peers()||[]).find(q=>q.sameTab);if(me)NET.my=me.peer;}catch(e){}}return NET.my;}
function netHost(){return NET.peers.find(q=>!q.sameTab&&q.presence&&q.presence.app===APPID&&q.presence.role==='host');}
function netTerminal(){if(APP.screen==='game'&&NET.on&&!NET.gone){NET.gone=true;lostConnection('Naputol ang koneksyon sa online room.');}}
function onNetPeers(ch){
  NET.peers=ch.peers;const me=ch.peers.find(q=>q.sameTab);if(me)NET.my=me.peer;const t=Date.now();for(const q of ch.peers)if(!NET.seen.has(q.peer))NET.seen.set(q.peer,t);
  if(NET.host){if(!NET.on)hostRoster();}
  else{const h=netHost();if(h){NET.hostPeer=h.peer;NET.hostSeenAt=t;const pr=h.presence;
      if(pr.log&&NET.gid&&pr.gid===NET.gid)mergeLog(pr.log);
      if(pr.st==='play'&&pr.gid&&pr.gid!==NET.started&&(APP.screen!=='game'||state.ended)){NET.started=pr.gid;const mine=(pr.roster||[]).some(e=>e.p===NET.my);if(mine)startOnline(pr);else joinFull();}}}
  if(NET.onUpdate)NET.onUpdate();
}
function mergeLog(lg){for(const key in lg){const k=+key.slice(1);if(k&&NET.log[k]===undefined){NET.log[k]=lg[key];if(k>NET.logMax)NET.logMax=k;}}}
function hostRoster(){
  const guests=NET.peers.filter(q=>!q.sameTab&&q.presence&&q.presence.app===APPID&&q.presence.role==='guest'&&!q.presence.gid).sort((a,b)=>(NET.seen.get(a.peer)||0)-(NET.seen.get(b.peer)||0)).slice(0,3);
  const roster=[{n:NET.name,p:myPeer()}].concat(guests.map(q=>({n:cleanName(q.presence.name)||'Kalaro',p:q.peer})));
  const key=JSON.stringify(roster);if(key!==NET.rosterKey){NET.rosterKey=key;NET.roster=roster;netPres({roster});}
}
function netRecord(k,r){NET.log[k]=r;if(k>NET.logMax)NET.logMax=k;const ks=Object.keys(NET.log).map(Number).sort((a,b)=>b-a).slice(0,40);const out={};for(const x of ks)out['k'+x]=NET.log[x];netPres({log:out});}
function netInput(k,v){if(NET.host){netRecord(k,{v});return;}NET.inp['k'+k]=v;const ks=Object.keys(NET.inp).sort((a,b)=>+a.slice(1)-+b.slice(1));while(ks.length>12)delete NET.inp[ks.shift()];netPres({inp:Object.assign({},NET.inp)});}
function netMg(obj,throttle){const t=Date.now();if(throttle&&t-NET.mgAt<110)return;NET.mgAt=t;netPres({mg:obj});}
function netPeerMg(peer,mgi){const q=netPeer(peer);const pr=q&&q.presence;return pr&&pr.gid===NET.gid&&pr.mg&&pr.mg.i===mgi?pr.mg:null;}
function netWaitLog(k,p,autoV,timeoutMs){
  const tok=gameToken;return new Promise(res=>{const t0=Date.now();let goneSince=null;
    const tick=()=>{if(tok!==gameToken)return;
      if(NET.log[k]!==undefined){res(NET.log[k]);return;}
      if(NET.host){if(p&&p.ctrl==='remote'){const q=netPeer(p.peer);const pr=q&&q.presence;const v=pr&&pr.gid===NET.gid&&pr.inp?pr.inp['k'+k]:undefined;
          if(v!==undefined){netRecord(k,{v});res(NET.log[k]);return;}
          if(!q){goneSince=goneSince||Date.now();}else goneSince=null;
          if((goneSince&&Date.now()-goneSince>5000)||Date.now()-t0>(timeoutMs||45000)){netRecord(k,{v:typeof autoV==='function'?autoV():autoV,a:1});res(NET.log[k]);return;}}}
      else{if(netHost())NET.hostSeenAt=Date.now();else if(Date.now()-NET.hostSeenAt>10000){lostConnection('Umalis ang gumawa ng room, kaya natapos ang online na laro.');return;}}
      setTimeout(tick,120);};
    tick();});
}
function lostConnection(msg){if(NET.gone&&APP.screen!=='game')return;NET.gone=true;gameToken++;scene=null;const c=openCard('<h2>Natapos ang laro</h2><p>'+esc(msg)+'</p><div class="row"><button type="button" class="btn primary" data-v="ok" data-primary>Bumalik sa menu</button></div>');cardChoice(c).then(()=>toTitle());}

/* ================= decisions (same order on every device) ================= */
async function decide(p,ui,botFn,autoV,timeoutMs){
  const tok=gameToken,k=++decK;
  if(p.ctrl==='bot')return await botFn();
  if(!NET.on)return await ui();
  if(p.ctrl==='local'){
    const logP=netWaitLog(k,p,autoV,timeoutMs);
    const first=await Promise.race([Promise.resolve().then(ui).then(v=>({v})),logP.then(r=>({log:r}))]);
    if(tok!==gameToken)await HALT;
    if(first.log){cancelLocalUI();return applyLog(p,first.log);}
    netInput(k,first.v);const r=await logP;if(tok!==gameToken)await HALT;return applyLog(p,r);
  }
  const prevHint=$('#hint').textContent;setHint('Hinihintay si '+p.name+'…');
  const r=await netWaitLog(k,p,autoV,timeoutMs);if(tok!==gameToken)await HALT;setHint(prevHint===('Hinihintay si '+p.name+'…')?'':prevHint);
  return applyLog(p,r);
}
function applyLog(p,r){if(r&&r.a&&p.ctrl!=='bot'){p.ctrl='bot';toast(p.name+' ay bot na muna','#fff',1400);}return r?r.v:undefined;}

async function hop(p,to,back){

  if(Math.abs(dy)>Math.abs(dx)*1.1){p.dir=dy<0?'back':'front';}else{p.dir='side';p.face=dx>=0?1:-1;}p.dirT=.8;
  Sfx.hop(back);const ox=p.offX,oy=p.offY;const prev=p.mood;p.mood=prev==='dizzy'?'dizzy':'hop';
  await tween(RM?.16:.27,(e,u)=>{const A=spacePos(from),B=spacePos(to);p.x=lerp(A.x+ox,B.x,e);p.y=lerp(A.y+oy,B.y,e);p.lift=Math.sin(Math.PI*u)*28;p.sy=u<.15?.84:1.1;p.sx=u<.15?1.12:.93;},Ez.inOut);
  p.pos=to;p.offX=0;p.offY=0;p.lift=0;p.hopping=false;if(p.mood==='hop')p.mood='idle';SP[to].pulse=.6;

async function runMinigame(kind,opt){
  opt=opt||{};
  const tok=gameToken,def=MG[kind]||MG.tumbang,mgi=++mgSeq,P=state.players;

  const scores=[];
  for(const p of P){const v=await decide(p,async()=>localScores[p.id]||0,async()=>def.botScore(pre[p.id]),()=>{const m=netPeerMg(p.peer,mgi);return m?(m.s|0):0;},45000);scores[p.id]=Number(v)||0;}

  await ask({title,html:rankRows(rows)+note,buttons:[{label:'Tuloy',value:'ok',primary:true}],autoMs:NET.on?8000:0});
  if(tok!==gameToken)await HALT;
  await iris(()=>{state.players.forEach(p=>{p.mood='idle';p.moodT=0;});scene=null;parts.length=0;floats.length=0;mapBtn.hidden=false;state.overview=false;state.focus={x:860,y:780};cam.x=860;cam.y=780;cam.z=boardZoom()*.8;setHint('');Music.play('board');});
  await wait(300);
  for(const p of P){if(pay[p.id]>0){p.piso+=pay[p.id];coinFly(p,pay[p.id]);burst(p.x,p.y-30,8,'coin',{up:true,spd:220,g:520,size:5});floatText('+'+pay[p.id],p.x,p.y-70,'#FFE07A',22);setMood(p,'happy',1);}}

}

async function hulingHirit(){
  await say('Huling Hirit!','#FFC93C',1200);
  const last=[...state.players].sort((a,b)=>a.korona-b.korona||a.piso-b.piso||b.id-a.id)[0];
  if(!last.item){last.item='doble';floatText('Libreng Dobleng dice!',last.x,last.y-80,'#fff',20);}else{last.piso+=5;coinFly(last,5);floatText('+5',last.x,last.y-70,'#FFE07A',22);}
  setMood(last,'happy',1.4);Sfx.coin();
  await say('Tulong kay '+last.name+', at doble ang premyo sa huling laro!','#fff',1900);
}
async function gameLoop(startRound,startTurn,token){
  for(let r=startRound;r<=maxR();r++){
    if(token!==gameToken)return;state.round=r;updateStatus();
    if(isTorneo()){
      if(r===1&&startTurn!==4)tip('torneo','Torneo: walang dice. Bawat panalo sa laro ay isang korona; piso ang batayan kapag tabla.');
      await say(r===maxR()?'Huling laro!':'Laro '+r+' ng '+maxR(),'#FFC93C',1100);if(token!==gameToken)return;
      state.turn=4;checkpoint();await runMinigame(state.plan[r-1]);startTurn=0;continue;}
    if(r===1&&startTurn===0)tip('goal','Layunin: pinakamaraming korona sa dulo ng laro. Dumaan sa korona na may 10 piso para bumili.');
    if(startTurn===0&&r>1)await say(r===maxR()?'Huling ikot!':'Ikot '+r,'#FFC93C',1100);
    if(startTurn===0&&r===maxR()&&maxR()>=3)await hulingHirit();
    for(let i=startTurn;i<4;i++){if(token!==gameToken)return;state.turn=i;checkpoint();await playTurn(state.players[i]);}
    startTurn=0;state.turn=4;checkpoint();
    if(token!==gameToken)return;await runMinigame(state.plan[r-1]);
  }
  if(token===gameToken)await finale();
}

function beginGame(spec,seed,cp,cfg){
  gameToken++;const tok=gameToken;scene=null;closeCard();clearRun();
  state.cfg=normCfg(cfg);gs=seed|0;decK=0;mgSeq=0;state.ended=false;
  state.plan=isHamon()?[MG[state.cfg.mg]?state.cfg.mg:'tumbang']:mgPlan(seed|0,maxR());
  state.players=makePlayers(spec);resetKorona();state.round=1;state.turn=0;state.overview=false;state.active=null;state.party=false;mapBtn.setAttribute('aria-pressed','false');
  let r0=1,t0=0;
  if(cp&&cp.players&&cp.players.length===4){cp.players.forEach((q,i)=>{const p=state.players[i];p.pos=clamp(q.pos|0,0,N-1);p.piso=q.piso|0;p.korona=q.korona|0;p.item=q.item&&ITEMS[q.item]?q.item:null;if(q.ctrl==='bot')p.ctrl='bot';if(q.stats)p.stats={wins:q.stats.wins|0,steps:q.stats.steps|0,dice:q.stats.dice|0};});
    if(Array.isArray(cp.korona)&&cp.korona.length===2)korona.spots=cp.korona.map(v=>clamp(v|0,0,N-1));r0=clamp(cp.round|0,1,maxR());t0=clamp(cp.turn|0,0,4);gs=cp.gs|0;decK=cp.decK|0;mgSeq=cp.mgSeq|0;
    if(Array.isArray(cp.plan)&&cp.plan.length===maxR()&&cp.plan.every(k=>MG[k]))state.plan=cp.plan.slice();}
  setScreen('game');state.active=state.players[t0<4?t0:0];updPlayers(0);buildHUD();
  const a=state.active;cam.x=cam.tx=a.x;cam.y=cam.ty=a.y-30;cam.z=cam.tz=boardZoom();
  if(isHamon()){(async()=>{const res=await runMinigame(state.plan[0],{hamon:true});if(tok===gameToken)await hamonResult(res);})();return;}
  if(t0===4){(async()=>{state.round=r0;await runMinigame(state.plan[r0-1]);if(tok===gameToken)await gameLoop(r0+1,0,tok);})();}
  else gameLoop(r0,t0,tok);
}

const LB_KEY='lsu-lb';let LB_MEM=null,HAMON_NAME='';
function lbGet(){if(LB_MEM)return LB_MEM;try{const o=JSON.parse(localStorage.getItem(LB_KEY)||'{}');return o&&typeof o==='object'?o:{};}catch(e){return{};}}
function lbAdd(kind,entry){const o=lbGet();o[kind]=(Array.isArray(o[kind])?o[kind]:[]).concat([entry]).sort((x,y)=>y.s-x.s||x.t-y.t).slice(0,12);try{localStorage.setItem(LB_KEY,JSON.stringify(o));}catch(e){LB_MEM=o;}return o[kind];}
function dayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function prettyDay(){const d=new Date(),M=['Ene','Peb','Mar','Abr','May','Hun','Hul','Ago','Set','Okt','Nob','Dis'];return M[d.getMonth()]+' '+d.getDate();}
function dayNum(){const d=new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);}
function dailyKind(){return MG_KEYS[dayNum()%MG_KEYS.length];}
function dailySeed(){let h=2166136261;const k='lsu-'+dayKey();for(let i=0;i<k.length;i++){h^=k.charCodeAt(i);h=Math.imul(h,16777619);}return(h|0)||7;}
function hamonName(){return HAMON_NAME||(state.setup&&state.setup.names&&state.setup.names[0])||NET.name||CHARS[0].name;}
function lbEntries(kind,daily){const a=lbGet()[kind]||[];return daily?a.filter(e=>e.daily&&e.d===dayKey()):a;}
function lbHTML(kind,daily){const a=lbEntries(kind,daily).slice(0,5),def=MG[kind];
  return'<p class="lbh">'+esc(daily?'Talaan ngayong araw':'Pinakamataas sa '+def.title)+' <span>· sa device na ito</span></p>'+(a.length?'<ol class="rank lb">'+a.map((e,i)=>'<li><span class="pos">'+(i+1)+'</span><span class="dot" style="background:'+(['#FFC93C','#C9D1D9','#D9A06F'][i]||'#F6E7CC')+'"></span><span class="who">'+esc(e.n)+'</span><span class="sc">'+esc(e.d.slice(5).replace('-','/'))+'</span><span class="pay">'+(e.s|0)+'</span></li>').join('')+'</ol>':'<p class="note">Wala pang iskor. Ikaw ang mauuna!</p>');}

  for(;;){
    const c=openMenuCard('<h2>'+(PAUSED?'Naka-pause':'Menu')+'</h2>'+(NET.on?'<p class="note">Hindi tumitigil ang online na laro habang bukas ito.</p>':'')+
      prefRow('music','Musika')+prefRow('sfx','Tunog')+(navigator.vibrate?prefRow('vib','Vibrate'):'')+
      '<div class="row"><button type="button" class="btn" data-v="guide">Paano maglaro</button><button type="button" class="btn" data-v="quit">Umalis sa laro</button></div><div class="row"><button type="button" class="btn primary" data-v="close" data-primary>Tuloy</button></div>');
    c.querySelectorAll('button[data-k]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;PREFS[k]=b.dataset.val==='1';savePrefs();Sfx.init();syncSoundBtn();
      c.querySelectorAll('button[data-k="'+k+'"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(k==='sfx'&&PREFS.sfx)Sfx.tick(4);if(k==='vib'&&PREFS.vib)buzz(30);}));
    const v=await cardChoice(c);
    if(v==='guide'){await guideFlow(openMenuCard);continue;}
    if(v==='quit'){if(await confirmQuit()){closeMenu();toTitle();return;}continue;}
    break;}
  closeMenu();try{if(back&&back.isConnected&&!back.hidden)back.focus({preventScroll:true});}catch(e){}
}
async function confirmQuit(){
  const msg=NET.on?'Aalis ka sa online room at bot ang papalit sa iyo.':(state.checkpoint?'Naka-save ang laro mula sa simula ng turn na ito. Ituloy ito mula sa main menu.':'Hindi mase-save ang larong ito.');
  return await cardChoice(openMenuCard('<h2>Umalis sa laro?</h2><p>'+esc(msg)+'</p><div class="row"><button type="button" class="btn primary" data-v="back" data-primary>Huwag</button><button type="button" class="btn" data-v="leave">Umalis</button></div>'))==='leave';
}
$('#menuBtn').addEventListener('click',()=>openMenu());

/* ================= saved game: a local game resumes from the start of its last turn ================= */
const SAVE_KEY='lsu-save',SAVE_V=2;
function saveGame(cp){try{localStorage.setItem(SAVE_KEY,JSON.stringify({v:SAVE_V,n:N,at:Date.now(),cp}));}catch(e){}}
function clearSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function loadSave(){try{const o=JSON.parse(localStorage.getItem(SAVE_KEY)||'null'),cp=o&&o.cp;
  if(!o||o.v!==SAVE_V||o.n!==N||!cp||cp.mode!=='local'||!cp.setup||!Array.isArray(cp.setup.names)||!Array.isArray(cp.players)||cp.players.length!==4)return null;return o;}catch(e){return null;}}
function refreshResume(){const o=loadSave(),b=$('#mResume');b.hidden=!o;if(!o)return;const cp=o.cp,c=normCfg(cp.setup.cfg),who=cp.setup.names.slice(0,cp.setup.n|0).map(cleanName).filter(Boolean);
  $('#mResumeSub').textContent=MODES[c.mode]+' · '+(c.mode==='torneo'?'Laro ':'Ikot ')+clamp(cp.round|0,1,c.rounds)+'/'+c.rounds+(who.length?' · '+who.join(', '):'');}
$('#mResume').addEventListener('click',()=>{Sfx.init();const o=loadSave();if(o)startLocal(o.cp.setup,o.cp);else refreshResume();});

/* sprite gallery */
let galSel=1,DL=null;
function showGallery(){setScreen('gallery');const box=$('#animChips');box.innerHTML=ANIMS.map((a,i)=>'<button type="button" data-i="'+i+'" aria-pressed="'+(i===galSel)+'">'+esc(a.label)+'</button>').join('');
  box.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{galSel=+b.dataset.i;box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));
  setTimeout(()=>{try{$('#galBack').focus({preventScroll:true});}catch(e){}},50);}
$('#galBack').addEventListener('click',()=>toTitle());
$('#galDl').addEventListener('click',()=>{Sfx.init();saveCanvas(buildSheet(),'laro-sa-ulap-sprites.png','Na-save ang sprite sheet');});
$('#mLocal').addEventListener('click',()=>{Sfx.init();localFlow();});
$('#mOnline').addEventListener('click',()=>{Sfx.init();onlineFlow();});
$('#mSprites').addEventListener('click',()=>{Sfx.init();showGallery();});
$('#mHamon').addEventListener('click',()=>{Sfx.init();hamonFlow();});
$('#mGuide').addEventListener('click',()=>{Sfx.init();guideFlow();});

/* ================= input ================= */
cv.addEventListener('pointerdown',e=>{Sfx.init();if(APP.screen!=='game')return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;try{cv.setPointerCapture(e.pointerId);}catch(_){}
  /* a tap on the board also rolls, but not while looking at the map or in the first moments after the button appears */
  if(scene){scene.pointerDown&&scene.pointerDown(x,y,e.pointerId);}else if(actionResolver&&!state.overview&&performance.now()-actionAt>350){actionResolver();}});
cv.addEventListener('pointermove',e=>{if(!scene||!scene.pointerMove)return;const r=cv.getBoundingClientRect();scene.pointerMove(e.clientX-r.left,e.clientY-r.top,e.pointerId);});
const ptrUp=e=>{if(scene&&scene.pointerUp){const r=cv.getBoundingClientRect();scene.pointerUp(e.clientX-r.left,e.clientY-r.top,e.pointerId);}};
cv.addEventListener('pointerup',ptrUp);cv.addEventListener('pointercancel',ptrUp);
window.addEventListener('keydown',e=>{if(e.defaultPrevented||topDialog()||APP.screen!=='game')return;if(e.key==='Escape'){e.preventDefault();openMenu();return;}Sfx.init();const onBtn=e.target&&e.target.tagName==='BUTTON';
  if(scene){if(onBtn&&(e.code==='Space'||e.code==='Enter'))return;scene.key&&scene.key(e,true);return;}
  if((e.code==='Space'||e.code==='Enter')&&!onBtn&&actionResolver){e.preventDefault();actionResolver();}
  if(e.code==='KeyM'){mapBtn.click();}});
window.addEventListener('keyup',e=>{if(scene&&scene.key)scene.key(e,false);});
/* dialogs: Tab stays inside the open card, Escape presses its back/close button */
const ESC_V=['back','prev','n','none','leave','close'];
document.addEventListener('keydown',e=>{const top=topDialog();if(!top)return;
  if(e.key==='Tab'){const f=[...top.querySelectorAll('button:not([disabled]),input')].filter(x=>x.offsetParent);if(!f.length)return;const i=f.indexOf(document.activeElement);
    if(i<0||(e.shiftKey&&i===0)||(!e.shiftKey&&i===f.length-1)){e.preventDefault();f[i<0||!e.shiftKey?0:f.length-1].focus();}}
  else if(e.key==='Escape'){const b=top.querySelector(ESC_V.map(v=>'button[data-v="'+v+'"]').join(','));if(b){e.preventDefault();b.click();}}},true);

/* ================= render loop ================= */
function drawSky(g){
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#86CBDD');gr.addColorStop(.55,'#BCE4DC');gr.addColorStop(1,'#F7DDB0');g.fillStyle=gr;g.fillRect(0,0,W,H);
  const sr=Math.max(W,H)*.6,sun=g.createRadialGradient(W*.86,H*.04,0,W*.86,H*.04,sr);sun.addColorStop(0,'rgba(255,246,218,.9)');sun.addColorStop(1,'rgba(255,246,218,0)');g.fillStyle=sun;g.fillRect(0,0,W,H);
  drawSunRays(g);drawCloudLayer(g,CLOUDS.far,.35,.5,.7);drawFarIslands(g);drawCloudLayer(g,CLOUDS.below,.72,.85,.95);
}
function drawBoard(g){
  g.save();applyCam(g);
  for(const r of ROCKS)drawRock(g,r);
  const order=[...ISL].sort((a,b)=>a.y-b.y);
  for(const isl of order){const b=islandBob(isl.id),s=isl.spr;g.drawImage(s.c,isl.x-s.ox,isl.y+b-s.oy,s.w,s.h);if(isl.kind==='beach'){drawWaterfall(g,isl,b);drawLagoonGlints(g,isl,b);}}
  for(let i=0;i<4;i++)drawBridge(g,i);
  for(let i=0;i<N;i++)drawSpace(g,i);
  const list=[];
  for(const pr of PROPS){const p=propPos(pr);list.push({y:p.y,f:()=>drawProp(g,pr,p.x,p.y)});}
  for(const p of state.players)list.push({y:p.y+.1,f:()=>drawKid(g,p,p.x,p.y,kidOpts(p))});
  for(const k of [0,1]){const kp=koronaPos(k);list.push({y:korona.fly&&korona.flyK===k?99999:kp.y-.5,f:()=>drawKoronaMarker(g,k)});}
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  for(const [a,b] of BUNTING)drawBunting(g,propTop(PROPS[a]),propTop(PROPS[b]),a+b);
  drawDiceLayer(g);drawFX(g);for(const b of BIRDS)drawBird(g,b);
  g.restore();
  drawCloudLayer(g,CLOUDS.front,1.25,1.15,.3);
}
function drawScene(g){g.save();applyCam(g);scene.draw(g);drawFX(g);g.restore();if(scene.drawScreen)scene.drawScreen(g);drawCountdown(g,scene);}
function drawGallery(g){
  const cr=cv.getBoundingClientRect(),pr=$('#galPanel').getBoundingClientRect();const top=16,bottom=Math.max(top+160,pr.top-cr.top-12);
  const cols=W<560?2:4,rows=Math.ceil(4/cols),gw=Math.min(W-32,cols===4?900:520),x0=(W-gw)/2,cw=gw/cols,ch=(bottom-top)/rows;const an=ANIMS[galSel];
  CHARS.forEach((c,i)=>{const cx=x0+(i%cols)*cw,cy=top+Math.floor(i/cols)*ch;rr(g,cx+4,cy+4,cw-8,ch-8,16);fs(g,'rgba(255,246,230,.93)',INK,2.5);
    g.font='900 14px '+BODY;g.textAlign='left';g.textBaseline='top';g.fillStyle=INK;g.fillText(c.name,cx+16,cy+14);g.font='800 11px '+BODY;g.fillStyle='rgba(59,35,22,.65)';g.fillText(an.id+' · '+an.n+' frames',cx+16,cy+31);
    const fi=Math.floor(now*an.fps)%an.n,fw=Math.min(40,(cw-28)/6),prevH=ch-8-fw-64,s=clamp(prevH/66,.55,2.6);
    drawKid(g,c,cx+cw/2,cy+48+prevH,Object.assign({scale:s},an.f(fi)));
    for(let k=0;k<an.n;k++){const fx=cx+14+k*fw,fy=cy+ch-14-fw;rr(g,fx+1,fy,fw-2,fw,6);fs(g,k===fi?'rgba(255,201,60,.7)':'rgba(246,231,204,.95)');drawKid(g,c,fx+fw/2,fy+fw-3,Object.assign({scale:fw/72},an.f(k)));}
  });
}
function drawTitleKids(){
  const c=$('#kidsCv');const r=c.getBoundingClientRect();if(!r.width||!r.height)return;const w=Math.round(r.width*DPR),h=Math.round(r.height*DPR);if(c.width!==w||c.height!==h){c.width=w;c.height=h;}
  const g=c.getContext('2d');g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,r.width,r.height);
  const cx=r.width/2,py=r.height-22;
  g.beginPath();g.moveTo(cx-r.width*.36,py+8);g.lineTo(cx-r.width*.1,py+20);g.lineTo(cx,py+22);g.lineTo(cx+r.width*.12,py+19);g.lineTo(cx+r.width*.36,py+8);g.closePath();fs(g,'#6B3B22',INK,2.5);
  ell(g,cx,py+5,r.width*.42,12);fs(g,'#8E5532',INK,2.5);ell(g,cx,py,r.width*.42,12);fs(g,'#7CC35A',INK,2.5);
  CHARS.forEach((ch,i)=>{const x=cx+(i-1.5)*r.width*.2,ph=now*3+i*1.3,j=RM?0:Math.max(0,Math.sin(ph))*12;const cheer=Math.floor(now*.6+i*.7)%3===0;
    drawKid(g,ch,x,py+3,{scale:1.2,lift:j,mood:cheer?'cheer':'happy',sy:j<1?.93:1.04,blink:Math.sin(now*1.3+i*2)>.97});});
}
let last=performance.now(),frameN=0,jeepT=2;
function update(dt){
  if(PAUSED){updCam(dt);return;}
  now+=dt;
  if(hitstop>0){hitstop-=dt;updCam(dt);return;}
  let gdt=dt;if(NET.on&&!NET.host&&!scene&&NET.logMax-decK>=2)gdt=dt*3;
  updTweens(gdt);if(scene&&APP.screen==='game')scene.update(dt);
  if(dice.on&&dice.spin){dice.tick-=dt;if(dice.tick<=0){dice.tick=.07;dice.vals=dice.vals.map(()=>1+Math.floor(R()*10));}}
  updPlayers(gdt);updFX(dt);updFlyers(dt);
  for(const s of SP)if(s.pulse>0)s.pulse=Math.max(0,s.pulse-dt*2.2);
  for(const b of BIRDS){b.x+=b.v*dt;if(b.x>1900)b.x=-200;if(b.x<-200)b.x=1900;}
  if(state.party&&R()<dt*10){const p=state.players.find(q=>q.mood==='cheer')||state.players[0];burst(p.x+(R()-.5)*60,p.y-120,6,'confetti',{spd:160,g:220,life:1.4,size:7});}
  if(!scene&&!RM){jeepT-=dt;if(jeepT<0){jeepT=2+R()*1.5;const pj=propPos(PROPS[5]);burst(pj.x-40,pj.y-8,2,'dust',{spd:22,life:.9,size:6,g:-40});}}
  if((++frameN)%20===0)measureHud();
  updCam(dt);hudTick(dt);
}
function draw(){const g=ctx;g.setTransform(DPR,0,0,DPR,0,0);drawSky(g);
  if(APP.screen==='gallery')drawGallery(g);else if(scene)drawScene(g);else drawBoard(g);
  g.fillStyle=pat(g,'grain');g.fillRect(0,0,W,H);
  drawFlyers(g);drawWipe(g);if(APP.screen==='title')drawTitleKids();}
function frame(t){const dt=Math.min(.05,Math.max(0,(t-last)/1000));last=t;try{for(let i=0;i<SPEED;i++)update(dt);draw();}catch(err){console.error(err);}requestAnimationFrame(frame);}

/* ================= boot ================= */
function start(data){
  resize();
  ISL.forEach(isl=>renderIsland(isl,false));renderIsland(ARENA,true);
  try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d||null;}).catch(()=>{});}catch(e){}
  const cp=data&&data.checkpoint;
  if(cp&&cp.mode==='local'&&cp.setup){startLocal(cp.setup,cp);}
  else{toTitle();const a={x:870,y:780};cam.x=cam.tx=a.x;cam.y=cam.ty=a.y;cam.z=cam.tz=fitZoom(1150,1000)*1.15;
    const hc=(location.hash||'').replace('#','').toUpperCase();if(/^[A-Z0-9]{4}$/.test(hc))setTimeout(()=>roomAvailable()?joinFlow(hc):onlineFlow(),400);}
  requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame);});
}
if(DEBUG){const m=/[?&]speed=(\d+)/.exec(location.search);if(m)SPEED=clamp(+m[1],1,60);
  window.__lsu={state,NET,MG,SP,N,korona,DBG,get scene(){return scene;},get screen(){return APP.screen;},setSpeed:v=>{SPEED=clamp(v|0,1,60);},startLocal:(s,cp)=>startLocal(s,cp),toTitle:()=>toTitle(),bench:n=>{const t=performance.now();for(let i=0;i<n;i++)draw();return(performance.now()-t)/n;}};}
try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({checkpoint:NET.on?null:state.checkpoint}));}catch(e){}
const boot=()=>{const h=window.claude&&window.claude.hot;if(h&&h.ready)h.ready(start);else start((h&&h.data)||{});};
if(document.fonts&&document.fonts.load){Promise.race([Promise.all([document.fonts.load('20px "Bagel Fat One"'),document.fonts.load('900 12px "Nunito"')]),new Promise(r=>setTimeout(r,1200))]).then(boot,boot);}else boot();

})();
</script>
